<!doctype html>

<title>Gerador 3D de Animais de Fazenda</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body { background:#f6f9fc; }
  .container-fluid { max-width:1440px; }
  .card { box-shadow:0 2px 10px rgba(0,0,0,.08); border:none; }
  #viewer { width:100%; height:520px; border-radius:8px; position:relative; overflow:hidden; }
  #viewer canvas { display:block; width:100%; height:100%; }
  .loading { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
             background:rgba(255,255,255,.92); padding:1rem 1.5rem; border-radius:8px; display:none; z-index:10; }
  .error-box { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
               background:rgba(220,53,69,.92); color:#fff; padding:1rem 1.5rem; border-radius:8px;
               display:none; z-index:10; }
  @media(max-width:991px){ #viewer { height:380px; } }
</style>
</head>
<body>

<div class="container-fluid py-3 px-3 px-lg-4">
  <div class="row g-3">
    <!-- Controles -->
    <div class="col-12 col-lg-3 order-2 order-lg-1">
      <div class="card">
        <div class="card-body p-3">
          <h1 class="h5 mb-1">🦙 Animais de Fazenda 3D</h1>
          <p class="text-muted small mb-3">Visualize e baixe STL para impressão 3D.</p>

          <div class="mb-3">
            <label class="form-label">🐄 Espécie</label>
            <select id="animal" class="form-select form-select-sm">
              <option value="bovino">🐄 Bovino</option>
              <option value="equino">🐴 Equino</option>
              <option value="suino">🐷 Suíno</option>
              <option value="ave">🐔 Ave</option>
              <option value="ovino">🐑 Ovino</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">📐 Escala (mm)</label>
            <input type="number" id="scale" value="10" step="0.5" min="5" max="30" class="form-control form-control-sm">
            <div class="form-text">10 mm ≈ 10×5×7 cm</div>
          </div>

          <div class="mb-3">
            <label class="form-label">🛠️ Tipo</label>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="tipo" value="solido" checked id="t-solido">
              <label class="form-check-label" for="t-solido">Sólido (1 peça)</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="tipo" value="articulado" id="t-art">
              <label class="form-check-label" for="t-art">Articulado (múltiplas peças)</label>
            </div>
          </div>

          <div class="mb-3" id="joint-field" style="display:none;">
            <label class="form-label">🔩 Junta (mm)</label>
            <input type="number" id="joint" value="3" step="0.5" min="1" max="10" class="form-control form-control-sm">
          </div>

          <div class="d-grid gap-2">
            <button id="btn-view" class="btn btn-primary btn-sm">🔄 Ver no 3D</button>
            <button id="btn-stl" class="btn btn-outline-success btn-sm">📦 STL (Sólido)</button>
            <button id="btn-zip" class="btn btn-outline-dark btn-sm">📦 ZIP (Articulado)</button>
          </div>

          <hr>
          <div class="small text-muted">
            <strong>Controles:</strong> Arrastar→girar | Scroll→zoom | Botão direito→mover<br>
            <strong>Impressão:</strong> PLA/PETG · 15-20% fill · 0.2mm camada
          </div>
        </div>
      </div>
    </div>

    <!-- Visualizador -->
    <div class="col-12 col-lg-9 order-1 order-lg-2">
      <div class="card h-100">
        <div class="card-body p-0">
          <div id="viewer">
            <canvas id="viewer-canvas"></canvas>
            <div class="loading" id="loading"><div class="spinner-border spinner-border-sm text-primary me-2"></div>Gerando…</div>
            <div class="error-box" id="errorbox"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="importmap">

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ========= Gerador STL ========= */
class Gen {
  constructor() { this.v = []; } // [n0,n1,n2, x1,y1,z1, x2,y2,z2, x3,y3,z3]

  tri(a, b, c) {
    // a,b,c: arrays [x,y,z]
    let ax=a[0], ay=a[1], az=a[2];
    let bx=b[0]-ax, by=b[1]-ay, bz=b[2]-az;
    let cx=c[0]-ax, cy=c[1]-ay, cz=c[2]-az;
    let nx = by*cz - bz*cy;
    let ny = bz*cx - bx*cz;
    let nz = bx*cy - by*cx;
    let len = Math.sqrt(nx*nx+ny*ny+nz*nz);
    if(len) { nx/=len; ny/=len; nz/=len; }
    this.v.push(nx, ny, nz, ax, ay, az, b[0], b[1], b[2], c[0], c[1], c[2]);
  }

  ellipsoid(rx, ry, rz, cx=0, cy=0, cz=0, seg=18, ring=14) {
    for (let i = 0; i < ring; i++) {
      let la0 = Math.PI * (-0.5 + i / ring);
      let la1 = Math.PI * (-0.5 + (i+1) / ring);
      for (let j = 0; j < seg; j++) {
        let lo0 = 2 * Math.PI * j / seg;
        let lo1 = 2 * Math.PI * (j+1) / seg;
        let pts = [];
        for (let la of [la0, la1]) {
          for (let lo of [lo0, lo1]) {
            pts.push([
              rx * Math.cos(la) * Math.cos(lo) + cx,
              ry * Math.sin(la) + cy,
              rz * Math.cos(la) * Math.sin(lo) + cz
            ]);
          }
        }
        this.tri(pts[0], pts[2], pts[1]);
        this.tri(pts[1], pts[2], pts[3]);
      }
    }
  }

  sphere(r, cx=0, cy=0, cz=0, seg=12, ring=10) {
    this.ellipsoid(r, r, r, cx, cy, cz, seg, ring);
  }

  cyl(r, h, cx=0, cy=0, cz=0, seg=16) {
    let hh = h/2;
    for (let i = 0; i < seg; i++) {
      let a0 = 2*Math.PI*i/seg, a1 = 2*Math.PI*(i+1)/seg;
      let x0 = r*Math.cos(a0)+cx, z0 = r*Math.sin(a0)+cz;
      let x1 = r*Math.cos(a1)+cx, z1 = r*Math.sin(a1)+cz;
      this.tri([x0,cy-hh,z0], [x1,cy-hh,z1], [x1,cy+hh,z1]);
      this.tri([x0,cy-hh,z0], [x1,cy+hh,z1], [x0,cy+hh,z0]);
    }
    // top cap
    for (let i = 0; i < seg; i++) {
      let a0 = 2*Math.PI*i/seg, a1 = 2*Math.PI*(i+1)/seg;
      this.tri([cx,cy+hh,cz], [r*Math.cos(a0)+cx,cy+hh,r*Math.sin(a0)+cz], [r*Math.cos(a1)+cx,cy+hh,r*Math.sin(a1)+cz]);
    }
    // bottom cap
    for (let i = 0; i < seg; i++) {
      let a0 = 2*Math.PI*i/seg, a1 = 2*Math.PI*(i+1)/seg;
      this.tri([cx,cy-hh,cz], [r*Math.cos(a1)+cx,cy-hh,r*Math.sin(a1)+cz], [r*Math.cos(a0)+cx,cy-hh,r*Math.sin(a0)+cz]);
    }
  }

  con(r, h, cx=0, cy=0, cz=0, seg=12) {
    let hh = h/2;
    for (let i = 0; i < seg; i++) {
      let a0 = 2*Math.PI*i/seg, a1 = 2*Math.PI*(i+1)/seg;
      let mid = (a0+a1)/2;
      let nx = Math.cos(mid), nz = Math.sin(mid);
      let ny = r/h;
      let len = Math.sqrt(nx*nx+ny*ny+nz*nz);
      nx/=len; ny/=len; nz/=len;
      let x0 = r*Math.cos(a0)+cx, z0 = r*Math.sin(a0)+cz;
      let x1 = r*Math.cos(a1)+cx, z1 = r*Math.sin(a1)+cz;
      let apex = [cx, cy+hh, cz];
      let cross = [nx, ny, nz];
      this.tri(apex, [x1, cy-hh, z1], [x0, cy-hh, z0]);
    }
    // base
    for (let i = 0; i < seg; i++) {
      let a0 = 2*Math.PI*i/seg, a1 = 2*Math.PI*(i+1)/seg;
      this.tri([cx, cy-hh, cz], [r*Math.cos(a0)+cx, cy-hh, r*Math.sin(a0)+cz], [r*Math.cos(a1)+cx, cy-hh, r*Math.sin(a1)+cz]);
    }
  }

  toGeometry() {
    let pos = [];
    for (let i = 0; i < this.v.length; i += 12) {
      // nx,ny,nz,x1,y1,z1,x2,y2,z2,x3,y3,z3
      pos.push(this.v[i+3], this.v[i+4], this.v[i+5]);
      pos.push(this.v[i+6], this.v[i+7], this.v[i+8]);
      pos.push(this.v[i+9], this.v[i+10], this.v[i+11]);
    }
    let geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    geo.computeVertexNormals();
    return geo;
  }

  toSTL() {
    let tris = this.v.length / 12;
    let buf = new ArrayBuffer(84 + tris * 50);
    let view = new DataView(buf);
    let hdr = "Farm 3D Gen";
    for (let i = 0; i < 80; i++) view.setUint8(i, i < hdr.length ? hdr.charCodeAt(i) : 0);
    view.setUint32(80, tris, true);
    let off = 84;
    for (let i = 0; i < this.v.length; i += 12) {
      view.setFloat32(off, this.v[i], true); off += 4;     // nx
      view.setFloat32(off, this.v[i+1], true); off += 4;   // ny
      view.setFloat32(off, this.v[i+2], true); off += 4;   // nz
      view.setFloat32(off, this.v[i+3], true); off += 4;   // x1
      view.setFloat32(off, this.v[i+4], true); off += 4;   // y1
      view.setFloat32(off, this.v[i+5], true); off += 4;   // z1
      view.setFloat32(off, this.v[i+6], true); off += 4;   // x2
      view.setFloat32(off, this.v[i+7], true); off += 4;   // y2
      view.setFloat32(off, this.v[i+8], true); off += 4;   // z2
      view.setFloat32(off, this.v[i+9], true); off += 4;   // x3
      view.setFloat32(off, this.v[i+10], true); off += 4;  // y3
      view.setFloat32(off, this.v[i+11], true); off += 4;  // z3
      view.setUint16(off, 0, true); off += 2;
    }
    return buf;
  }
}

/* ======== Generators ======== */
function genBovine(s) {
  let g = new Gen();
  g.ellipsoid(2*s, 1.8*s, 3.5*s, 0, 2.5*s, 0);
  g.cyl(0.9*s, 2*s, 0, 4*s, 0.5*s);
  g.ellipsoid(1*s, 0.9*s, 1.5*s, 0, 5.2*s, 1.2*s);
  g.ellipsoid(0.7*s, 0.6*s, 0.8*s, 0, 4.8*s, 2.2*s);
  g.con(0.2*s, 0.8*s, -0.5*s, 5.5*s, 1*s);
  g.con(0.2*s, 0.8*s, 0.5*s, 5.5*s, 1*s);
  g.ellipsoid(0.3*s, 0.4*s, 0.5*s, -0.7*s, 5.3*s, 0.8*s);
  g.ellipsoid(0.3*s, 0.4*s, 0.5*s, 0.7*s, 5.3*s, 0.8*s);
  for (let [lx, lz] of [[-1.2*s, 2*s],[1.2*s, 2*s],[-1.2*s, -2*s],[1.2*s, -2*s]]) {
    g.cyl(0.4*s, 2.5*s, lx, 0.8*s, lz);
    g.cyl(0.45*s, 0.3*s, lx, 0.15*s, lz);
  }
  g.cyl(0.15*s, 2*s, 0, 3*s, -3.5*s);
  g.ellipsoid(0.3*s, 0.3*s, 0.5*s, 0, 2*s, -4.2*s);
  g.ellipsoid(0.8*s, 0.6*s, 1*s, 0, 0.8*s, -1*s);
  return g;
}

function genEquine(s) {
  let g = new Gen();
  g.ellipsoid(1.8*s, 1.6*s, 4*s, 0, 3*s, 0);
  g.cyl(0.7*s, 2.5*s, 0, 4.5*s, 0.8*s);
  g.ellipsoid(0.8*s, 0.7*s, 1.8*s, 0, 5.8*s, 1.5*s);
  g.ellipsoid(0.5*s, 0.5*s, 1*s, 0, 5.5*s, 2.5*s);
  g.con(0.15*s, 0.5*s, -0.4*s, 6.2*s, 1.2*s);
  g.con(0.15*s, 0.5*s, 0.4*s, 6.2*s, 1.2*s);
  for (let [lx, lz] of [[-1*s, 2.2*s],[1*s, 2.2*s],[-1*s, -2.2*s],[1*s, -2.2*s]]) {
    g.cyl(0.3*s, 3*s, lx, 0.8*s, lz);
    g.cyl(0.35*s, 0.25*s, lx, 0.15*s, lz);
  }
  g.cyl(0.12*s, 2.5*s, 0, 3.2*s, -3.8*s);
  g.ellipsoid(0.4*s, 0.8*s, 0.3*s, 0, 1.5*s, -4.8*s);
  g.ellipsoid(0.3*s, 0.8*s, 1.5*s, 0.8*s, 4.5*s, 0.5*s);
  return g;
}

function genPorine(s) {
  let g = new Gen();
  g.ellipsoid(2.2*s, 1.5*s, 2.8*s, 0, 2*s, 0);
  g.ellipsoid(1.2*s, 1*s, 1.3*s, 0, 2.5*s, 1.8*s);
  g.cyl(0.6*s, 0.5*s, 0, 2.3*s, 2.8*s);
  g.ellipsoid(0.5*s, 0.3*s, 0.2*s, 0, 2.3*s, 3.1*s);
  g.ellipsoid(0.4*s, 0.5*s, 0.2*s, -0.7*s, 3*s, 1.2*s);
  g.ellipsoid(0.4*s, 0.5*s, 0.2*s, 0.7*s, 3*s, 1.2*s);
  for (let [lx, lz] of [[-1.3*s, 1.5*s],[1.3*s, 1.5*s],[-1.3*s, -1.5*s],[1.3*s, -1.5*s]]) {
    g.cyl(0.35*s, 1.2*s, lx, 0.5*s, lz);
    g.cyl(0.4*s, 0.2*s, lx, 0.1*s, lz);
  }
  g.cyl(0.1*s, 0.8*s, 0, 2.5*s, -2.5*s);
  return g;
}

function genAve(s) {
  let g = new Gen();
  g.ellipsoid(1.5*s, 1.3*s, 2*s, 0, 2*s, 0);
  g.sphere(0.7*s, 0, 3.2*s, 0.5*s);
  g.con(0.2*s, 0.5*s, 0, 3.5*s, 1*s);
  g.ellipsoid(0.15*s, 0.4*s, 0.3*s, 0, 3.6*s, 0.3*s);
  g.ellipsoid(0.15*s, 0.35*s, 0.3*s, 0, 3.5*s, 0.6*s);
  g.ellipsoid(0.2*s, 0.25*s, 0.15*s, 0, 3*s, 1*s);
  g.ellipsoid(0.3*s, 0.5*s, 0.8*s, -1.3*s, 2*s, 0.5*s);
  g.ellipsoid(0.3*s, 0.5*s, 0.8*s, 1.3*s, 2*s, 0.5*s);
  for (let lx of [-0.5*s, 0.5*s]) {
    g.cyl(0.15*s, 1*s, lx, 0.5*s, 0.5*s);
    g.ellipsoid(0.3*s, 0.1*s, 0.4*s, lx, 0.05*s, 0.8*s);
  }
  g.ellipsoid(0.4*s, 0.3*s, 0.8*s, 0, 2.5*s, -1.8*s);
  return g;
}

function genOvine(s) {
  let g = new Gen();
  g.ellipsoid(2*s, 1.8*s, 3*s, 0, 2.5*s, 0);
  for (let [wx, wy, wz] of [[-1.5*s, 3*s, 1*s],[1.5*s, 3*s, 1*s],[-1.5*s, 3*s, -1*s],[1.5*s, 3*s, -1*s],[0, 3.5*s, 2*s],[0, 3.5*s, -2*s],[-1.8*s, 2.5*s, 0],[1.8*s, 2.5*s, 0],[0, 3.2*s, 0]]) {
    g.sphere(0.6*s, wx, wy, wz);
  }
  g.ellipsoid(0.8*s, 0.9*s, 1.2*s, 0, 2.8*s, 1.5*s);
  g.ellipsoid(0.5*s, 0.5*s, 0.6*s, 0, 2.5*s, 2.2*s);
  g.ellipsoid(0.25*s, 0.4*s, 0.15*s, -0.5*s, 2.9*s, 1.3*s);
  g.ellipsoid(0.25*s, 0.4*s, 0.15*s, 0.5*s, 2.9*s, 1.3*s);
  for (let [lx, lz] of [[-1*s, 1.5*s],[1*s, 1.5*s],[-1*s, -1.5*s],[1*s, -1.5*s]]) {
    g.cyl(0.25*s, 1.5*s, lx, 0.6*s, lz);
    g.cyl(0.3*s, 0.2*s, lx, 0.1*s, lz);
  }
  g.ellipsoid(0.3*s, 0.3*s, 0.4*s, 0, 2.2*s, -2.5*s);
  return g;
}

const SOLIDS = { bovino: genBovine, equino: genEquine, suino: genPorine, ave: genAve, ovino: genOvine };

// Articulados (partes separadas)
function genBovineParts(s) {
  let parts = [];
  let t = new Gen();
  t.ellipsoid(2*s, 1.8*s, 3.5*s, 0, 2.5*s, 0);
  t.ellipsoid(0.8*s, 0.6*s, 1*s, 0, 0.8*s, -1*s);
  parts.push({name:"01_tronco", desc:"Corpo + úbere", g:t});
  let h = new Gen();
  h.ellipsoid(1*s, 0.9*s, 1.5*s, 0, 0, 0.7*s);
  h.ellipsoid(0.7*s, 0.6*s, 0.8*s, 0, -0.4*s, 1.7*s);
  h.con(0.2*s, 0.8*s, -0.5*s, 0.3*s, 0.5*s);
  h.con(0.2*s, 0.8*s, 0.5*s, 0.3*s, 0.5*s);
  parts.push({name:"02_cabeca", desc:"Cabeça + chifres", g:h});
  for (let [pn, pd, lx, lz] of [["03_pata_fe","Pata frente ESQ",-1.2*s,2*s],["04_pata_fd","Pata frente DIR",1.2*s,2*s],["05_pata_te","Pata trás ESQ",-1.2*s,-2*s],["06_pata_td","Pata trás DIR",1.2*s,-2*s]]) {
    let lg = new Gen();
    lg.cyl(0.35*s, 1.5*s, 0, 0.7*s, 0);
    lg.cyl(0.3*s, 0.8*s, 0, 0.2*s, 0);
    lg.cyl(0.4*s, 0.25*s, 0, -0.2*s, 0);
    parts.push({name:pn, desc:pd, g:lg});
  }
  let tail = new Gen();
  tail.cyl(0.12*s, 2*s, 0, 0, 0);
  tail.ellipsoid(0.3*s, 0.3*s, 0.5*s, 0, -1*s, -0.2*s);
  parts.push({name:"07_rabo", desc:"Rabo", g:tail});
  return parts;
}

const ARTICULATED = { bovino: genBovineParts };

/* ========= Three.js Viewer ========= */
const viewer = document.getElementById('viewer');
const canvasEl = document.getElementById('viewer-canvas');
const loading = document.getElementById('loading');
const errorBox = document.getElementById('errorbox');

let scene, camera, renderer, controls, mesh;

function initThree() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0xeef0f4);

  camera = new THREE.PerspectiveCamera(45, viewer.clientWidth / viewer.clientHeight, 0.1, 1000);
  camera.position.set(30, 20, 30);

  renderer = new THREE.WebGLRenderer({ canvas: canvasEl, antialias: true });
  renderer.setSize(viewer.clientWidth, viewer.clientHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.enablePan = true;
  controls.minDistance = 5;
  controls.maxDistance = 200;

  scene.add(new THREE.HemisphereLight(0xffffff, 0x888888, 1.2));
  let dir = new THREE.DirectionalLight(0xffffff, 0.8);
  dir.position.set(30, 50, 20);
  dir.castShadow = true;
  dir.shadow.mapSize.width = 1024;
  dir.shadow.mapSize.height = 1024;
  scene.add(dir);

  let gr = new THREE.Mesh(new THREE.PlaneGeometry(200,200), new THREE.ShadowMaterial({opacity:0.1}));
  gr.rotation.x = -Math.PI/2; gr.position.y = -0.5; gr.receiveShadow = true;
  scene.add(gr);

  animate();
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  let w = viewer.clientWidth, h = viewer.clientHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});

function showLoading(v) { loading.style.display = v ? 'block' : 'none'; }
function showError(msg) { errorBox.textContent = msg; errorBox.style.display = 'block'; setTimeout(()=>errorBox.style.display='none', 5000); }

function renderModel(genOrParts, isParts=false) {
  showLoading(true);
  setTimeout(() => {
    try {
      if (mesh) { mesh.geometry.dispose(); scene.remove(mesh); }

      let material = new THREE.MeshStandardMaterial({
        color: 0x8b7355, metalness: 0.05, roughness: 0.8,
        // polygon offset para evitar z-fighting
        polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1
      });

      if (isParts) {
        // Articulado: mostrar peças separadas com leve espalhamento
        for (let i = 0; i < 50; i++) scene.remove(scene.children[scene.children.length-1-i]);
        
        let allGeos = [];
        let offset = 0;
        for (let p of genOrParts) {
          let geo = p.g.toGeometry();
          allGeos.push(geo);
        }
        let merged = THREE.BufferGeometryUtils.mergeGeometries(allGeos, false);
        mesh = new THREE.Mesh(merged, material);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        scene.add(mesh);
      } else {
        let geo = genOrParts.toGeometry();
        mesh = new THREE.Mesh(geo, material);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        scene.add(mesh);
      }

      // Auto-ajustar câmera
      let box = new THREE.Box3().setFromObject(mesh);
      let center = box.getCenter(new THREE.Vector3());
      let size = box.getSize(new THREE.Vector3());
      mesh.position.sub(center);
      mesh.position.y += size.y / 2;

      let max = Math.max(size.x, size.y, size.z);
      let dist = max * 2;
      controls.target.set(0, size.y/2, 0);
      camera.position.set(dist, dist*0.8, dist);
      controls.update();

      showLoading(false);
    } catch (e) {
      console.error(e);
      showError('Erro: ' + e.message);
      showLoading(false);
    }
  }, 10);
}

/* ========= Ações ========= */
function getVals() {
  return {
    animal: document.getElementById('animal').value,
    scale: parseFloat(document.getElementById('scale').value) || 10,
    tipo: document.querySelector('input[name="tipo"]:checked').value,
    joint: parseFloat(document.getElementById('joint').value) || 3
  };
}

function regenerate() {
  let v = getVals();
  if (v.tipo === 'solido') {
    let gen = SOLIDS[v.animal](v.scale);
    renderModel(gen, false);
  } else {
    let parts = (ARTICULATED[v.animal] || genBovineParts)(v.scale);
    renderModel(parts, true);
  }
}

function downloadSTL() {
  let v = getVals();
  let gen = SOLIDS[v.animal](v.scale);
  let buf = gen.toSTL();
  let blob = new Blob([buf], {type: 'application/octet-stream'});
  let url = URL.createObjectURL(blob);
  let a = document.createElement('a');
  a.href = url;
  a.download = `${v.animal}_solido_${Math.round(v.scale*10)}mm.stl`;
  a.click();
  URL.revokeObjectURL(url);
}

async function downloadZIP() {
  let v = getVals();
  let JSZip = await import('https://cdn.jsdelivr.net/npm/jszip@3.10.1/+esm');
  let zip = new (JSZip.default || JSZip)();
  let parts = (ARTICULATED[v.animal] || genBovineParts)(v.scale);

  let guide = `${v.animal.toUpperCase()} - GUIA DE MONTAGEM\n\n`;
  guide += `Peças: ${parts.length}\n`;
  for (let p of parts) guide += `📦 ${p.name}: ${p.desc}\n`;
  guide += `\nJuntas: bola-soquete (3mm padrão)\nMonte encaixando cabeça no tronco, patas nos soquetes laterais, rabo na base.\n`;

  zip.file('00_GUIA_MONTAGEM.txt', guide);
  for (let p of parts) {
    zip.file(`${p.name}.stl`, p.g.toSTL());
  }

  let blob = await zip.generateAsync({type: 'blob'});
  let url = URL.createObjectURL(blob);
  let a = document.createElement('a');
  a.href = url;
  a.download = `${v.animal}_articulado.zip`;
  a.click();
  URL.revokeObjectURL(url);
}

/* ========= Eventos ========= */
document.getElementById('btn-view').addEventListener('click', regenerate);
document.getElementById('btn-stl').addEventListener('click', downloadSTL);
document.getElementById('btn-zip').addEventListener('click', downloadZIP);

document.getElementById('animal').addEventListener('change', regenerate);
document.getElementById('scale').addEventListener('input', regenerate);
document.querySelectorAll('input[name="tipo"]').forEach(r => {
  r.addEventListener('change', () => {
    document.getElementById('joint-field').style.display = (r.value === 'articulado') ? 'block' : 'none';
    regenerate();
  });
});

// Init
initThree();
regenerate();
</script>
