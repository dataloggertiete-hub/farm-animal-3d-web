<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gerador 3D de Animais de Fazenda</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body { background:#f6f9fc; }
  .container-fluid { max-width:1440px; }
  .card { box-shadow:0 2px 10px rgba(0,0,0,.08); border:none; }
  #viewer { width:100%; height:560px; border-radius:8px; position:relative; overflow:hidden; }
  #viewer canvas { display:block; width:100%; height:100%; }
  .loading { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
             background:rgba(255,255,255,.92); padding:1rem 1.5rem; border-radius:8px; display:none; z-index:10; }
  .error-box { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
               background:rgba(220,53,69,.92); color:#fff; padding:1rem 1.5rem; border-radius:8px;
               display:none; z-index:10; }
  @media(max-width:991px){ #viewer { height:380px; } }
</style>
</head>
<body>

<div class="container-fluid py-3 px-3 px-lg-4">
  <div class="row g-3">
    <!-- Controles -->
    <div class="col-12 col-lg-3 order-2 order-lg-1">
      <div class="card">
        <div class="card-body p-3">
          <h1 class="h5 mb-1">🦙 Animais de Fazenda 3D</h1>
          <p class="text-muted small mb-3">Visualize e baixe STL para impressão 3D.</p>

          <div class="mb-3">
            <label class="form-label">🐄 Espécie</label>
            <select id="animal" class="form-select form-select-sm">
              <option value="bovino">🐄 Bovino</option>
              <option value="equino">🐴 Equino</option>
              <option value="suino">🐷 Suíno</option>
              <option value="ave">🐔 Ave</option>
              <option value="ovino">🐑 Ovino</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">📐 Escala (mm)</label>
            <input type="number" id="scale" value="10" step="0.5" min="5" max="30" class="form-control form-control-sm">
            <div class="form-text">10 mm ≈ 10×5×7 cm</div>
          </div>

          <div class="mb-3">
            <label class="form-label">🛠️ Tipo</label>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="tipo" value="solido" checked id="t-solido">
              <label class="form-check-label" for="t-solido">Sólido (1 peça)</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="tipo" value="articulado" id="t-art">
              <label class="form-check-label" for="t-art">Articulado (múltiplas peças)</label>
            </div>
          </div>

          <div class="mb-3" id="joint-field" style="display:none;">
            <label class="form-label">🔩 Junta (mm)</label>
            <input type="number" id="joint" value="3" step="0.5" min="1" max="10" class="form-control form-control-sm">
          </div>

          <div class="d-grid gap-2">
            <button id="btn-view" class="btn btn-primary btn-sm">🔄 Ver no 3D</button>
            <button id="btn-stl" class="btn btn-outline-success btn-sm">📦 STL (Sólido)</button>
            <button id="btn-zip" class="btn btn-outline-dark btn-sm">📦 ZIP (Articulado)</button>
          </div>

          <hr>
          <div class="small text-muted">
            <strong>Controles:</strong> Arrastar→girar | Scroll→zoom | Botão direito→mover<br>
            <strong>Impressão:</strong> PLA/PETG · 15-20% fill · 0.2mm camada
          </div>
        </div>
      </div>
    </div>

    <!-- Visualizador -->
    <div class="col-12 col-lg-9 order-1 order-lg-2">
      <div class="card h-100">
        <div class="card-body p-0">
          <div id="viewer">
            <canvas id="viewer-canvas"></canvas>
            <div class="loading" id="loading"><div class="spinner-border spinner-border-sm text-primary me-2"></div>Gerando…</div>
            <div class="error-box" id="errorbox"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* =====================================================================
   GERADOR DE GEOMETRIA
   Sistema de coordenadas: Y = cima, Z = frente, X = direita. Solo em y=0.
   ===================================================================== */
class Gen {
  constructor(){ this.v = []; }

  tri(a, b, c) {
    let ax=a[0], ay=a[1], az=a[2];
    let bx=b[0]-ax, by=b[1]-ay, bz=b[2]-az;
    let cx=c[0]-ax, cy=c[1]-ay, cz=c[2]-az;
    let nx = by*cz - bz*cy;
    let ny = bz*cx - bx*cz;
    let nz = bx*cy - by*cx;
    let len = Math.sqrt(nx*nx+ny*ny+nz*nz);
    if(len) { nx/=len; ny/=len; nz/=len; }
    this.v.push(nx, ny, nz, ax, ay, az, b[0], b[1], b[2], c[0], c[1], c[2]);
  }

  ellipsoid(rx, ry, rz, cx=0, cy=0, cz=0, seg=18, ring=14) {
    for (let i = 0; i < ring; i++) {
      let la0 = Math.PI * (-0.5 + i / ring);
      let la1 = Math.PI * (-0.5 + (i+1) / ring);
      for (let j = 0; j < seg; j++) {
        let lo0 = 2 * Math.PI * j / seg;
        let lo1 = 2 * Math.PI * (j+1) / seg;
        let p = [];
        for (let la of [la0, la1])
          for (let lo of [lo0, lo1])
            p.push([
              rx * Math.cos(la) * Math.cos(lo) + cx,
              ry * Math.sin(la) + cy,
              rz * Math.cos(la) * Math.sin(lo) + cz
            ]);
        this.tri(p[0], p[2], p[1]);
        this.tri(p[1], p[2], p[3]);
      }
    }
  }

  sphere(r, cx=0, cy=0, cz=0, seg=14, ring=10) {
    this.ellipsoid(r, r, r, cx, cy, cz, seg, ring);
  }

  // Tronco de cone: rBot em y=-h/2, rTop em y=+h/2 (cilindro se rBot==rTop, cone se rTop~0)
  frustum(rBot, rTop, h, cx=0, cy=0, cz=0, seg=16) {
    let hh = h/2;
    for (let i = 0; i < seg; i++) {
      let a0 = 2*Math.PI*i/seg, a1 = 2*Math.PI*(i+1)/seg;
      this.tri(
        [rBot*Math.cos(a0)+cx, cy-hh, rBot*Math.sin(a0)+cz],
        [rBot*Math.cos(a1)+cx, cy-hh, rBot*Math.sin(a1)+cz],
        [rTop*Math.cos(a1)+cx, cy+hh, rTop*Math.sin(a1)+cz]
      );
      this.tri(
        [rBot*Math.cos(a0)+cx, cy-hh, rBot*Math.sin(a0)+cz],
        [rTop*Math.cos(a1)+cx, cy+hh, rTop*Math.sin(a1)+cz],
        [rTop*Math.cos(a0)+cx, cy+hh, rTop*Math.sin(a0)+cz]
      );
    }
    if (rTop > 0.0005)
      for (let i = 0; i < seg; i++) {
        let a0 = 2*Math.PI*i/seg, a1 = 2*Math.PI*(i+1)/seg;
        this.tri([cx,cy+hh,cz],
                 [rTop*Math.cos(a0)+cx, cy+hh, rTop*Math.sin(a0)+cz],
                 [rTop*Math.cos(a1)+cx, cy+hh, rTop*Math.sin(a1)+cz]);
      }
    if (rBot > 0.0005)
      for (let i = 0; i < seg; i++) {
        let a0 = 2*Math.PI*i/seg, a1 = 2*Math.PI*(i+1)/seg;
        this.tri([cx,cy-hh,cz],
                 [rBot*Math.cos(a1)+cx, cy-hh, rBot*Math.sin(a1)+cz],
                 [rBot*Math.cos(a0)+cx, cy-hh, rBot*Math.sin(a0)+cz]);
      }
  }

  cyl(r, h, cx=0, cy=0, cz=0, seg=16) { this.frustum(r, r, h, cx, cy, cz, seg); }
  con(r, h, cx=0, cy=0, cz=0, seg=12) { this.frustum(r, 0.02, h, cx, cy, cz, seg); }

  // Bola para articulação
  joint(r, cx=0, cy=0, cz=0) { this.sphere(r, cx, cy, cz, 12, 8); }

  toGeometry() {
    let pos = [];
    for (let i = 0; i < this.v.length; i += 12) {
      pos.push(this.v[i+3], this.v[i+4], this.v[i+5]);
      pos.push(this.v[i+6], this.v[i+7], this.v[i+8]);
      pos.push(this.v[i+9], this.v[i+10], this.v[i+11]);
    }
    let geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    geo.computeVertexNormals();
    return geo;
  }

  toSTL() {
    let tris = this.v.length / 12;
    let buf = new ArrayBuffer(84 + tris * 50);
    let view = new DataView(buf);
    let hdr = "Farm Animal 3D v3";
    for (let i = 0; i < 80; i++) view.setUint8(i, i < hdr.length ? hdr.charCodeAt(i) : 0);
    view.setUint32(80, tris, true);
    let off = 84;
    for (let i = 0; i < this.v.length; i += 12) {
      for (let k = 0; k < 12; k++) { view.setFloat32(off, this.v[i+k], true); off += 4; }
      view.setUint16(off, 0, true); off += 2;
    }
    return buf;
  }
}

/* =====================================================================
   COMPONENTES REUTILIZÁVEIS (pernas com cascos, etc.)
   ===================================================================== */

// Pata de quadrupéde com casco: g = gerador, x/lz = posição, h = altura
function legQuad(g, x, z, h, rTop, rBot, kneeY) {
  g.frustum(rBot, rTop, h, x, h/2, z, 14);            // perna cônica (grossa em cima, fina embaixo)
  g.frustum(rBot*1.08, rBot*1.25, h*0.12, x, h*0.06, z, 14); // casco
  if (kneeY) g.sphere(rTop*0.75, x, kneeY, z + rTop*0.25, 10, 8); // articulação (joelho/jarrete)
}

// Cabeça bovina + chifres + orelhas + focinho
function headBovine(g, s, cx, cy, cz) {
  g.ellipsoid(0.85*s, 0.8*s, 1.0*s, cx, cy, cz);
  g.ellipsoid(0.68*s, 0.55*s, 0.6*s, cx, cy-0.3*s, cz+0.75*s);   // focinho largo
  g.con(0.16*s, 0.95*s, cx-0.42*s, cy+0.85*s, cz+0.2*s, 8);      // chifres
  g.con(0.16*s, 0.95*s, cx+0.42*s, cy+0.85*s, cz+0.2*s, 8);
  g.ellipsoid(0.16*s, 0.38*s, 0.5*s, cx-0.95*s, cy+0.35*s, cz-0.1*s); // orelhas
  g.ellipsoid(0.16*s, 0.38*s, 0.5*s, cx+0.95*s, cy+0.35*s, cz-0.1*s);
}

// Pescoço em arco (cadeia de esferas)
function neckArc(g, points, radii) {
  for (let i = 0; i < points.length; i++) {
    let p = points[i], r = radii[i];
    g.sphere(r*s_of(g), p[0], p[1], p[2]);
  }
}
let _s = 1;
function s_of(g) { return _s; }

/* =====================================================================
   ANIMAIS SÓLIDOS
   ===================================================================== */

function genBovine(s) {
  _s = s;
  let g = new Gen();
  // Tronco (grande, profundo)
  g.ellipsoid(2.1*s, 1.9*s, 3.0*s, 0, 3.3*s, 0);
  g.ellipsoid(1.9*s, 1.7*s, 1.4*s, 0, 3.4*s, 2.0*s);   // peito
  g.ellipsoid(1.9*s, 1.7*s, 1.4*s, 0, 3.4*s, -2.0*s);  // garupa
  // Úbere com tetos
  g.sphere(0.55*s, 0, 1.6*s, -0.8*s, 10, 8);
  for (let dx of [-0.3*s, 0.3*s]) {
    g.con(0.08*s, 0.4*s, dx, 1.1*s, -0.8*s, 6);
  }
  // Patas (cônicas + casco + joelho/jarrete)
  legQuad(g, -1.25*s,  1.9*s, 2.5*s, 0.62*s, 0.36*s, 1.7*s);
  legQuad(g,  1.25*s,  1.9*s, 2.5*s, 0.62*s, 0.36*s, 1.7*s);
  legQuad(g, -1.25*s, -1.9*s, 2.5*s, 0.62*s, 0.36*s, 1.5*s);
  legQuad(g,  1.25*s, -1.9*s, 2.5*s, 0.62*s, 0.36*s, 1.5*s);
  // Pescoço (arqueado p/ frente-cima)
  g.sphere(1.05*s, 0, 4.4*s, 1.9*s);
  g.sphere(0.9*s,  0, 4.9*s, 2.7*s);
  g.sphere(0.75*s, 0, 5.2*s, 3.3*s);
  // Cabeça
  headBovine(g, s, 0, 5.5*s, 3.9*s);
  // Rabo (fino, pendurado na garupa) + tufo
  g.frustum(0.14*s, 0.07*s, 2.0*s, 0, 3.4*s, -3.0*s, 8);
  g.ellipsoid(0.22*s, 0.45*s, 0.22*s, 0, 2.3*s, -3.1*s);
  return g;
}

function genEquine(s) {
  _s = s;
  let g = new Gen();
  // Tronco (longo, atlético)
  g.ellipsoid(1.7*s, 1.8*s, 3.1*s, 0, 3.7*s, -0.3*s);
  g.ellipsoid(1.55*s, 1.6*s, 1.3*s, 0, 3.9*s, 2.0*s);   // peito
  g.ellipsoid(1.55*s, 1.6*s, 1.3*s, 0, 3.9*s, -2.3*s);  // garupa
  // Patas longas e finas
  legQuad(g, -0.9*s,  2.3*s, 3.2*s, 0.5*s, 0.26*s, 1.8*s);   // frente (joelho)
  legQuad(g,  0.9*s,  2.3*s, 3.2*s, 0.5*s, 0.26*s, 1.8*s);
  legQuad(g, -0.9*s, -2.4*s, 3.2*s, 0.55*s, 0.28*s, 2.0*s);  // trás (jarrete)
  legQuad(g,  0.9*s, -2.4*s, 3.2*s, 0.55*s, 0.28*s, 2.0*s);
  // Pescoço arqueado (característico)
  g.sphere(1.05*s, 0, 4.8*s, 1.7*s);
  g.sphere(0.95*s, 0, 5.4*s, 2.3*s);
  g.sphere(0.85*s, 0, 5.9*s, 2.7*s);
  // Cabeça longa + focinho
  g.ellipsoid(0.62*s, 0.7*s, 1.35*s, 0, 6.6*s, 3.5*s);
  g.ellipsoid(0.48*s, 0.45*s, 0.55*s, 0, 6.25*s, 4.55*s);
  // Orelhas pontudas
  g.con(0.18*s, 0.65*s, -0.32*s, 7.35*s, 3.0*s, 8);
  g.con(0.18*s, 0.65*s,  0.32*s, 7.35*s, 3.0*s, 8);
  // Crina (crista do pescoço)
  for (let [px, py, pz] of [[0, 5.15*s, 1.35*s],[0, 5.75*s, 1.95*s],[0, 6.25*s, 2.4*s],[0, 6.7*s, 2.85*s]]) {
    g.ellipsoid(0.3*s, 0.5*s, 0.55*s, px, py, pz);
  }
  g.ellipsoid(0.3*s, 0.4*s, 0.4*s, 0, 7.1*s, 3.1*s); // crina na cabeça
  // Rabo longo + tufo
  g.frustum(0.12*s, 0.05*s, 2.4*s, 0, 3.6*s, -3.3*s, 8);
  g.ellipsoid(0.3*s, 0.8*s, 0.22*s, 0, 2.5*s, -3.45*s);
  return g;
}

function genPorine(s) {
  _s = s;
  let g = new Gen();
  // Tronco (gordo e redondo)
  g.ellipsoid(2.3*s, 1.85*s, 2.7*s, 0, 2.7*s, 0);
  g.ellipsoid(2.1*s, 1.6*s, 1.2*s, 0, 2.8*s, 1.9*s);  // frente
  // Patas curtas e grossas
  legQuad(g, -1.45*s,  1.55*s, 1.7*s, 0.6*s, 0.42*s, 0);
  legQuad(g,  1.45*s,  1.55*s, 1.7*s, 0.6*s, 0.42*s, 0);
  legQuad(g, -1.45*s, -1.55*s, 1.7*s, 0.6*s, 0.42*s, 0);
  legQuad(g,  1.45*s, -1.55*s, 1.7*s, 0.6*s, 0.42*s, 0);
  // Cabeça + focinho característico (disco largo e achatado)
  g.sphere(1.05*s, 0, 3.1*s, 2.5*s);
  g.ellipsoid(0.68*s, 0.42*s, 0.5*s, 0, 2.85*s, 3.45*s);   // focinho
  g.sphere(0.12*s, -0.28*s, 2.7*s, 3.9*s, 8, 6);           // narinas
  g.sphere(0.12*s,  0.28*s, 2.7*s, 3.9*s, 8, 6);
  // Orelhas grandes caídas
  g.ellipsoid(0.18*s, 0.55*s, 0.42*s, -0.85*s, 3.85*s, 2.2*s);
  g.ellipsoid(0.18*s, 0.55*s, 0.42*s,  0.85*s, 3.85*s, 2.2*s);
  // Rabo espiral (esfera em hélice) — característica marcante!
  let cx = 0, cy = 3.0*s, cz = -2.6*s;
  for (let i = 0; i < 26; i++) {
    let t = i / 25;
    let ang = t * 4.5 * Math.PI;
    let r = 0.3 * s * (1 - t*0.3);
    g.sphere(0.09*s,
      cx + r * Math.cos(ang),
      cy - 0.2*s + r * Math.sin(ang) * 0.8,
      cz - 0.15*s - t*0.1*s, 6, 5);
  }
  return g;
}

function genAve(s) {
  _s = s;
  let g = new Gen();
  // Corpo (ovo, peito cheio)
  g.ellipsoid(1.45*s, 1.5*s, 1.85*s, 0, 2.7*s, 0.2*s);
  g.ellipsoid(1.2*s, 1.1*s, 1.0*s, 0, 2.4*s, 1.1*s);   // peito
  // Rabo em leque (penas para cima-trás)
  g.ellipsoid(0.14*s, 0.85*s, 0.28*s, 0, 4.1*s, -1.55*s);
  g.ellipsoid(0.14*s, 0.75*s, 0.26*s, -0.32*s, 3.9*s, -1.3*s);
  g.ellipsoid(0.14*s, 0.75*s, 0.26*s,  0.32*s, 3.9*s, -1.3*s);
  // Pescoço + cabeça
  g.sphere(0.55*s, 0, 4.0*s, 1.0*s);
  g.sphere(0.68*s, 0, 4.55*s, 1.35*s);
  // Bico (cônico achatado)
  g.ellipsoid(0.26*s, 0.16*s, 0.45*s, 0, 4.4*s, 2.05*s);
  // Crista (bumps no topo da cabeça)
  g.sphere(0.17*s, 0, 5.3*s, 1.05*s, 8, 6);
  g.sphere(0.2*s,  0, 5.42*s, 1.35*s, 8, 6);
  g.sphere(0.17*s, 0, 5.3*s, 1.65*s, 8, 6);
  // Barbela
  g.sphere(0.16*s, 0, 3.95*s, 1.95*s, 8, 6);
  // Asas dobradas
  g.ellipsoid(0.28*s, 0.75*s, 1.05*s, -1.4*s, 2.9*s, 0.0*s);
  g.ellipsoid(0.28*s, 0.75*s, 1.05*s,  1.4*s, 2.9*s, 0.0*s);
  // Patas finas + pés
  for (let lx of [-0.45*s, 0.45*s]) {
    g.cyl(0.1*s, 1.5*s, lx, 0.75*s, 0.55*s, 8);
    g.ellipsoid(0.32*s, 0.09*s, 0.5*s, lx, 0.09*s, 0.8*s);  // pé
    g.ellipsoid(0.12*s, 0.07*s, 0.28*s, lx, 0.08*s, 0.35*s); // garras p/ trás
  }
  return g;
}

function genOvine(s) {
  _s = s;
  let g = new Gen();
  // Corpo lã (núcleo + tufos)
  g.ellipsoid(2.0*s, 1.85*s, 2.8*s, 0, 3.3*s, 0);
  let bumps = [
    [-1.5, 4.3, 1.2, 0.85],[1.5, 4.3, 1.2, 0.85],[-1.6, 4.2, -1.1, 0.85],[1.6, 4.2, -1.1, 0.85],
    [0, 4.9, 1.8, 0.8],[0, 4.9, -1.8, 0.8],[0, 5.1, 0, 0.9],
    [-2.0, 3.3, 0.6, 0.8],[2.0, 3.3, 0.6, 0.8],[-2.0, 3.3, -0.6, 0.8],[2.0, 3.3, -0.6, 0.8],
    [-1.4, 4.5, 0, 0.85],[1.4, 4.5, 0, 0.85],
  ];
  for (let [bx, by, bz, br] of bumps) g.sphere(br*s, bx*s, by*s, bz*s, 10, 8);
  // Patas finas
  legQuad(g, -1.05*s,  1.55*s, 2.4*s, 0.42*s, 0.24*s, 0);
  legQuad(g,  1.05*s,  1.55*s, 2.4*s, 0.42*s, 0.24*s, 0);
  legQuad(g, -1.05*s, -1.55*s, 2.4*s, 0.42*s, 0.24*s, 0);
  legQuad(g,  1.05*s, -1.55*s, 2.4*s, 0.42*s, 0.24*s, 0);
  // Cabeça pequena + focinho
  g.sphere(0.72*s, 0, 5.0*s, 2.7*s);
  g.ellipsoid(0.5*s, 0.45*s, 0.55*s, 0, 4.75*s, 3.35*s);
  // Orelhas caídas
  g.ellipsoid(0.14*s, 0.38*s, 0.42*s, -0.8*s, 4.9*s, 2.55*s);
  g.ellipsoid(0.14*s, 0.38*s, 0.42*s,  0.8*s, 4.9*s, 2.55*s);
  // Rabo curto
  g.sphere(0.38*s, 0, 3.9*s, -2.75*s, 8, 6);
  return g;
}

/* =====================================================================
   ANIMAIS ARTICULADOS (partes separadas)
   ===================================================================== */
function partsBovine(s) {
  _s = s;
  let parts = [];
  let t = new Gen();
  t.ellipsoid(2.1*s, 1.9*s, 3.0*s, 0, 3.3*s, 0);

  t.sphere(0.55*s, 0, 1.6*s, -0.8*s);
  t.sphere(1.05*s, 0, 4.4*s, 1.9*s);   // base do pescoço
  t.sphere(0.9*s, 0, 4.9*s, 2.7*s);
  t.joint(0.5*s, 0, 5.15*s, 3.2*s);    // soquete da cabeça
  t.frustum(0.14*s, 0.07*s, 2.0*s, 0, 3.4*s, -3.0*s, 8);
  t.ellipsoid(0.22*s, 0.45*s, 0.22*s, 0, 2.3*s, -3.1*s);
  parts.push({name:"01_tronco", desc:"Tronco + pescoço + úbere + rabo", g:t});

  let h = new Gen();

  h.joint(0.42*s, 0, -0.85*s, 0.2*s);  // bola p/ encaixar
  parts.push({name:"02_cabeca", desc:"Cabeça + chifres + orelhas", g:h});

  let legPos = [["03_pata_fe","Pata frontal ESQ",-1.25*s,1.9*s],["04_pata_fd","Pata frontal DIR",1.25*s,1.9*s],
                ["05_pata_te","Pata traseira ESQ",-1.25*s,-1.9*s],["06_pata_td","Pata traseira DIR",1.25*s,-1.9*s]];
  for (let [pn, pd, lx, lz] of legPos) {
    let lg = new Gen();
    lg.joint(0.55*s, 0, 1.0*s, 0);     // bola de articulação
    lg.frustum(0.36*s, 0.55*s, 1.5*s, 0, 0.35*s, 0, 14);
    lg.frustum(0.39*s, 0.46*s, 0.18*s, 0, -0.4*s, 0, 14);

  h.ellipsoid(0.14*s, 0.38*s, 0.42*s, -0.8*s, -0.1*s, -0.15*s);

const SOLIDS = { bovino: genBovine, equino: genEquine, suino: genPorine, ave: genAve, ovino: genOvine };
const PARTS  = { bovino: partsBovine, equino: partsEquine, suino: partsPorine, ave: partsAve, ovino: partsOvine };

/* =====================================================================
   VISUALIZADOR THREE.JS
   ===================================================================== */
const viewer = document.getElementById('viewer');
const canvasEl = document.getElementById('viewer-canvas');
const loading = document.getElementById('loading');
const errorBox = document.getElementById('errorbox');

let scene, camera, renderer, controls, currentGroup;

function initThree() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0xeef0f4);

  camera = new THREE.PerspectiveCamera(45, viewer.clientWidth / viewer.clientHeight, 0.1, 1000);
  camera.position.set(30, 20, 30);

  renderer = new THREE.WebGLRenderer({ canvas: canvasEl, antialias: true });
  renderer.setSize(viewer.clientWidth, viewer.clientHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.enablePan = true;
  controls.minDistance = 5;
  controls.maxDistance = 200;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 1.2;
  controls.addEventListener('start', () => controls.autoRotate = false);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x888888, 1.2));
  let dir = new THREE.DirectionalLight(0xffffff, 0.8);
  dir.position.set(30, 50, 20);
  dir.castShadow = true;
  dir.shadow.mapSize.width = 1024;
  dir.shadow.mapSize.height = 1024;
  dir.shadow.camera.left = -30; dir.shadow.camera.right = 30;
  dir.shadow.camera.top = 30; dir.shadow.camera.bottom = -30;
  scene.add(dir);

  let gr = new THREE.Mesh(new THREE.PlaneGeometry(300,300), new THREE.ShadowMaterial({opacity:0.12}));
  gr.rotation.x = -Math.PI/2; gr.position.y = -0.01; gr.receiveShadow = true;
  scene.add(gr);

  let grid = new THREE.GridHelper(120, 40, 0xbbbbbb, 0xd8dde4);
  grid.position.y = 0;
  scene.add(grid);

  animate();
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  let w = viewer.clientWidth, h = viewer.clientHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});

function showLoading(v) { loading.style.display = v ? 'block' : 'none'; }
function showError(msg) { errorBox.textContent = msg; errorBox.style.display = 'block'; setTimeout(()=>errorBox.style.display='none', 5000); }

function makeMaterial() {
  return new THREE.MeshStandardMaterial({ color: 0x9c7e5a, metalness: 0.05, roughness: 0.75 });
}

function clearCurrent() {
  if (currentGroup) {
    scene.remove(currentGroup);
    currentGroup.traverse(o => { if (o.geometry) o.geometry.dispose(); });
    currentGroup = null;
  }
}

function frameCamera(group) {
  let box = new THREE.Box3().setFromObject(group);
  let center = box.getCenter(new THREE.Vector3());
  let size = box.getSize(new THREE.Vector3());
  let max = Math.max(size.x, size.y, size.z);
  let dist = max * 1.9;
  controls.target.set(center.x, center.y, center.z);
  camera.position.set(center.x + dist*0.9, center.y + dist*0.6, center.z + dist*0.9);
  controls.update();
}

function showSolid(gen) {
  showLoading(true);
  setTimeout(() => {
    try {
      clearCurrent();
      let geo = gen.toGeometry();
      currentGroup = new THREE.Group();
      let m = new THREE.Mesh(geo, makeMaterial());
      m.castShadow = true; m.receiveShadow = true;
      // Centralizar na origem
      let box = new THREE.Box3().setFromObject(m);
      let center = box.getCenter(new THREE.Vector3());
      m.position.sub(center);
      currentGroup.add(m);
      scene.add(currentGroup);
      frameCamera(currentGroup);
      showLoading(false);
    } catch(e) { console.error(e); showError('Erro: ' + e.message); showLoading(false); }
  }, 10);
}

function showParts(parts) {
  showLoading(true);
  setTimeout(() => {
    try {
      clearCurrent();
      currentGroup = new THREE.Group();
      let mat = makeMaterial();
      let n = parts.length;
      for (let i = 0; i < n; i++) {
        let p = parts[i];
        let geo = p.g.toGeometry();
        let m = new THREE.Mesh(geo, mat);
        m.castShadow = true; m.receiveShadow = true;
        // Centralizar cada peça e posicionar em círculo
        let box = new THREE.Box3().setFromObject(m);
        let center = box.getCenter(new THREE.Vector3());
        m.position.sub(center);
        let angle = i / n * Math.PI * 2;
        let radius = n > 2 ? 16 : 8;
        m.position.x += Math.cos(angle) * radius;
        m.position.z += Math.sin(angle) * radius;
        m.rotation.y = -angle;
        currentGroup.add(m);
      }
      scene.add(currentGroup);
      frameCamera(currentGroup);
      showLoading(false);
    } catch(e) { console.error(e); showError('Erro: ' + e.message); showLoading(false); }
  }, 10);
}

/* ========= Ações ========= */
function getVals() {
  return {
    animal: document.getElementById('animal').value,
    scale: parseFloat(document.getElementById('scale').value) || 10,
    tipo: document.querySelector('input[name="tipo"]:checked').value
  };
}

function regenerate() {
  let v = getVals();
  if (v.tipo === 'solido') {
    showSolid(SOLIDS[v.animal](v.scale));
  } else {
    showParts(PARTS[v.animal](v.scale));
  }
}

function downloadSTL() {
  let v = getVals();
  let buf = SOLIDS[v.animal](v.scale).toSTL();
  let blob = new Blob([buf], {type: 'application/octet-stream'});
  let url = URL.createObjectURL(blob);
  let a = document.createElement('a');
  a.href = url;
  a.download = `${v.animal}_solido_${Math.round(v.scale*10)}mm.stl`;
  a.click();
  URL.revokeObjectURL(url);
}

async function downloadZIP() {
  let v = getVals();
  let JSZip = await import('https://cdn.jsdelivr.net/npm/jszip@3.10.1/+esm');
  let zip = new (JSZip.default || JSZip)();
  let parts = PARTS[v.animal](v.scale);

  let guide = `ANIMAL ARTICULADO - ${v.animal.toUpperCase()}\n\n`;
  guide += `Total de peças: ${parts.length}\n\n`;
  for (let p of parts) guide += `📦 ${p.name}.stl — ${p.desc}\n`;
  guide += `\nMONTAGEM:\n`;
  guide += `• Cada pata tem uma BOLA no topo → encaixe no lado do tronco\n`;
  guide += `• A CABEÇA tem uma bola → encaixe no topo do pescoço do tronco\n`;
  guide += `• Folga de impressão: 0.2mm por lado\n`;
  guide += `• Material: PLA · 20% fill · 0.2mm camada\n`;

  zip.file('00_GUIA_MONTAGEM.txt', guide);
  for (let p of parts) zip.file(`${p.name}.stl`, p.g.toSTL());

  let blob = await zip.generateAsync({type: 'blob'});
  let url = URL.createObjectURL(blob);
  let a = document.createElement('a');
  a.href = url;
  a.download = `${v.animal}_articulado.zip`;
  a.click();
  URL.revokeObjectURL(url);
}

/* ========= Eventos ========= */
document.getElementById('btn-view').addEventListener('click', regenerate);
document.getElementById('btn-stl').addEventListener('click', () => { downloadSTL(); regenerate(); });
document.getElementById('btn-zip').addEventListener('click', () => { downloadZIP(); regenerate(); });

document.getElementById('animal').addEventListener('change', regenerate);
document.getElementById('scale').addEventListener('input', regenerate);
document.querySelectorAll('input[name="tipo"]').forEach(r => {
  r.addEventListener('change', () => {
    document.getElementById('joint-field').style.display = (r.value === 'articulado') ? 'block' : 'none';
    regenerate();
  });
});

initThree();
regenerate();
</script>
