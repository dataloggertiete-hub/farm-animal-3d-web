<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gerador 3D de Animais de Fazenda - Detalhes Anatômicos</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body { background:#f0f2f5; margin:0; }
  .container-fluid { max-width:1440px; }
  .card { box-shadow:0 2px 10px rgba(0,0,0,.08); border:none; }
  #viewer { width:100%; height:580px; border-radius:8px; position:relative; overflow:hidden; }
  #viewer canvas { display:block; width:100%; height:100%; }
  .loading { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
             background:rgba(255,255,255,.95); padding:1rem 1.5rem; border-radius:8px; display:none; z-index:10; text-align:center; }
  .error-box { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
               background:rgba(220,53,69,.95); color:#fff; padding:1rem 1.5rem; border-radius:8px;
               display:none; z-index:10; }
  @media(max-width:991px){ #viewer { height:380px; } }
  .form-label { font-weight:600; }
  .small-muted { color:#6c757d; }
</style>
</head>
<body>

<div class="container-fluid py-3 px-3 px-lg-4">
  <div class="row g-3">
    <div class="col-12 col-lg-3 order-2 order-lg-1">
      <div class="card mb-3">
        <div class="card-body p-3">
          <h1 class="h5 mb-1">🦙 Animais de Fazenda 3D</h1>
          <p class="small-muted mb-3">Modelos anatômicos realistas para impressão 3D.</p>

          <div class="mb-3">
            <label class="form-label">🐄 Espécie</label>
            <select id="animal" class="form-select form-select-sm">
              <option value="bovino">🐄 Bovino</option>
              <option value="equino">🐴 Equino</option>
              <option value="suino">🐷 Suíno</option>
              <option value="ave">🐔 Ave</option>
              <option value="ovino">🐑 Ovino</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">📐 Escala (mm)</label>
            <input type="number" id="scale" value="10" step="0.5" min="5" max="30" class="form-control form-control-sm">
            <div class="small-muted">10 mm ≈ 10×5×7 cm</div>
          </div>

          <div class="mb-3">
            <label class="form-label">🛠️ Tipo</label>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="tipo" value="solido" checked id="t-solido">
              <label class="form-check-label small" for="t-solido">Sólido (1 peça)</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="tipo" value="articulado" id="t-art">
              <label class="form-check-label small" for="t-art">Articulado (múltiplas peças)</label>
            </div>
          </div>

          <div class="mb-3" id="joint-field" style="display:none;">
            <label class="form-label">🔩 Diâmetro da junta (mm)</label>
            <input type="number" id="joint" value="3" step="0.5" min="1" max="10" class="form-control form-control-sm">
          </div>

          <div class="d-grid gap-2">
            <button id="btn-view" class="btn btn-primary btn-sm">🔄 Ver no 3D</button>
            <button id="btn-stl" class="btn btn-outline-success btn-sm">📦 STL (Sólido)</button>
            <button id="btn-zip" class="btn btn-outline-dark btn-sm">📦 ZIP (Articulado)</button>
          </div>

          <hr class="my-3">
          <div class="small text-muted">
            <strong>Controles:</strong> Arrastar→girar | Scroll→zoom | Botão direito→mover<br>
            <strong>Impressão:</strong> PLA/PETG · 20% fill · 0.2mm camada
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-body p-3">
          <div id="status-text" class="small mb-1">Pronto</div>
          <div class="progress" style="height:6px;">
            <div id="progress-bar" class="progress-bar bg-success" style="width:100%"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="col-12 col-lg-9 order-1 order-lg-2">
      <div class="card h-100">
        <div class="card-body p-0">
          <div id="viewer">
            <canvas id="viewer-canvas"></canvas>
            <div class="loading" id="loading">
              <div class="spinner-border spinner-border-sm text-primary mb-2" role="status"></div>
              <div>Gerando modelo 3D…</div>
            </div>
            <div class="error-box" id="errorbox"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* =====================================================================
   GERADOR DE GEOMETRIA - Versão Detalhada Anatômica
   Coordenadas: Y=altura, Z=frente, X=lateral. Solo em Y=0.
   ===================================================================== */
class Gen {
  constructor(){ this.v = []; }

  tri(a, b, c) {
    let ax=a[0], ay=a[1], az=a[2];
    let bx=b[0]-ax, by=b[1]-ay, bz=b[2]-az;
    let cx=c[0]-ax, cy=c[1]-ay, cz=c[2]-az;
    let nx = by*cz - bz*cy;
    let ny = bz*cx - bx*cz;
    let nz = bx*cy - by*cx;
    let len = Math.sqrt(nx*nx+ny*ny+nz*nz);
    if(len) { nx/=len; ny/=len; nz/=len; }
    this.v.push(nx, ny, nz, ax, ay, az, b[0], b[1], b[2], c[0], c[1], c[2]);
  }

  // Elipsoide (elipses 3D)
  ellipsoid(rx, ry, rz, cx=0, cy=0, cz=0, seg=20, ring=16) {
    for (let i = 0; i < ring; i++) {
      let la0 = Math.PI * (-0.5 + i / ring);
      let la1 = Math.PI * (-0.5 + (i+1) / ring);
      for (let j = 0; j < seg; j++) {
        let lo0 = 2 * Math.PI * j / seg;
        let lo1 = 2 * Math.PI * (j+1) / seg;
        let p = [];
        for (let la of [la0, la1])
          for (let lo of [lo0, lo1])
            p.push([
              rx * Math.cos(la) * Math.cos(lo) + cx,
              ry * Math.sin(la) + cy,
              rz * Math.cos(la) * Math.sin(lo) + cz
            ]);
        this.tri(p[0], p[2], p[1]);
        this.tri(p[1], p[2], p[3]);
      }
    }
  }

  sphere(r, cx=0, cy=0, cz=0, seg=14, ring=10) {
    this.ellipsoid(r, r, r, cx, cy, cz, seg, ring);
  }

  // Tronco (cones e cilindros): rBot em y=-h/2, rTop em y=+h/2
  frustum(rBot, rTop, h, cx=0, cy=0, cz=0, seg=16) {
    let hh = h/2;
    for (let i = 0; i < seg; i++) {
      let a0 = 2*Math.PI*i/seg, a1 = 2*Math.PI*(i+1)/seg;
      this.tri(
        [rBot*Math.cos(a0)+cx, cy-hh, rBot*Math.sin(a0)+cz],
        [rBot*Math.cos(a1)+cx, cy-hh, rBot*Math.sin(a1)+cz],
        [rTop*Math.cos(a1)+cx, cy+hh, rTop*Math.sin(a1)+cz]
      );
      this.tri(
        [rBot*Math.cos(a0)+cx, cy-hh, rBot*Math.sin(a0)+cz],
        [rTop*Math.cos(a1)+cx, cy+hh, rTop*Math.sin(a1)+cz],
        [rTop*Math.cos(a0)+cx, cy+hh, rTop*Math.sin(a0)+cz]
      );
    }
    if (rTop > 0.0005)
      for (let i = 0; i < seg; i++) {
        let a0 = 2*Math.PI*i/seg, a1 = 2*Math.PI*(i+1)/seg;
        this.tri([cx,cy+hh,cz],
                 [rTop*Math.cos(a0)+cx, cy+hh, rTop*Math.sin(a0)+cz],
                 [rTop*Math.cos(a1)+cx, cy+hh, rTop*Math.sin(a1)+cz]);
      }
    if (rBot > 0.0005)
      for (let i = 0; i < seg; i++) {
        let a0 = 2*Math.PI*i/seg, a1 = 2*Math.PI*(i+1)/seg;
        this.tri([cx,cy-hh,cz],
                 [rBot*Math.cos(a1)+cx, cy-hh, rBot*Math.sin(a1)+cz],
                 [rBot*Math.cos(a0)+cx, cy-hh, rBot*Math.sin(a0)+cz]);
      }
  }

  cyl(r, h, cx=0, cy=0, cz=0, seg=16) { this.frustum(r, r, h, cx, cy, cz, seg); }
  con(r, h, cx=0, cy=0, cz=0, seg=12) { this.frustum(r, 0.02, h, cx, cy, cz, seg); }
  joint(r, cx=0, cy=0, cz=0) { this.sphere(r, cx, cy, cz, 12, 8); }

  // Cadeia de esferas (para crinas, rabo, lã)
  chain(r, cx, cy, cz, dx, dy, dz, n=8, taper=0.8) {
    for (let i = 0; i < n; i++) {
      let t = i / (n-1 || 1);
      let r2 = r * (1 - t*(1-taper));
      this.sphere(r2, cx + dx*t, cy + dy*t, cz + dz*t, 8, 6);
    }
  }

  // Elipse 2D (anúnculo de esferas) - para detalhes de pelagem
  ellipseRing(r, cx, cy, cz, n=12) {
    for (let i = 0; i < n; i++) {
      let a = 2*Math.PI*i/n;
      this.sphere(r, cx + r*Math.cos(a), cy, cz + r*Math.sin(a), 6, 5);
    }
  }

  // Disco/oval (para patas de aves, orelhas)
  oval(rx, ry, cx=0, cy=0, cz=0, seg=16, thick=1) {
    let th = thick * rx * 0.3;
    for (let face = 0; face < 2; face++) {
      let sign = face === 0 ? 1 : -1;
      for (let i = 0; i < seg; i++) {
        let a0 = 2*Math.PI*i/seg, a1 = 2*Math.PI*(i+1)/seg;
        let c0x = rx*Math.cos(a0), c0y = ry*Math.sin(a0);
        let c1x = rx*Math.cos(a1), c1y = ry*Math.sin(a1);
        let xoff = sign > 0 ? th/2 : -th/2;
        this.tri(
          [c0x+cx, c0y+cy, xoff+cz],
          [c1x+cx, c1y+cy, xoff+cz],
          [c0x+cx, c0y+cy, -xoff+cz]
        );
        this.tri(
          [c0x+cx, c0y+cy, -xoff+cz],
          [c1x+cx, c1y+cy, xoff+cz],
          [c1x+cx, c1y+cy, -xoff+cz]
        );
      }
    }
    // Lados
    for (let i = 0; i < seg; i++) {
      let a0 = 2*Math.PI*i/seg, a1 = 2*Math.PI*(i+1)/seg;
      let x0 = rx*Math.cos(a0), y0 = ry*Math.sin(a0);
      let x1 = rx*Math.cos(a1), y1 = ry*Math.sin(a1);
      this.tri([x0+cx, y0+cy, th/2+cz], [x1+cx, y1+cy, th/2+cz], [x0+cx, y0+cy, -th/2+cz]);
      this.tri([x0+cx, y0+cy, -th/2+cz], [x1+cx, y1+cy, th/2+cz], [x1+cx, y1+cy, -th/2+cz]);
    }
  }

  toGeometry() {
    let pos = [];
    for (let i = 0; i < this.v.length; i += 12) {
      pos.push(this.v[i+3], this.v[i+4], this.v[i+5]);
      pos.push(this.v[i+6], this.v[i+7], this.v[i+8]);
      pos.push(this.v[i+9], this.v[i+10], this.v[i+11]);
    }
    let geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    geo.computeVertexNormals();
    return geo;
  }

  // Elipse 2D (para detalhes de barba/orelhas)
  arc(cx, cy, cz, r, aStart, aEnd, nSteps=6) {
    for (let i = 0; i < nSteps; i++) {
      let t0 = aStart + (aEnd - aStart) * i / nSteps;
      let t1 = aStart + (aEnd - aStart) * (i+1) / nSteps;
      this.tri(
        [cx + r*Math.cos(t0), cy, cz + r*Math.sin(t0)],
        [cx + r*Math.cos(t1), cy, cz + r*Math.sin(t1)],
        [cx, cy + (r*0.2), cz]
      );
    }
  }

  toSTL(name="FarmAnimal3D") {
    let tris = this.v.length / 12;
    let buf = new ArrayBuffer(84 + tris * 50);
    let view = new DataView(buf);
    for (let i = 0; i < 80; i++) view.setUint8(i, i < name.length ? name.charCodeAt(i) : 0);
    view.setUint32(80, tris, true);
    let off = 84;
    for (let i = 0; i < this.v.length; i += 12) {
      for (let k = 0; k < 12; k++) { view.setFloat32(off, this.v[i+k], true); off += 4; }
      view.setUint16(off, 0, true); off += 2;
    }
    return buf;
  }
}

/* =====================================================================
   COMPONENTES ANATÔMICOS REUTILIZÁVEIS
   ===================================================================== */

// Pata de quadrupede com casco duplo (comeata)
function quadLeg(g, x, z, h, rTop, rBot, kneeY, s) {
  // Perna cônica principal
  g.frustum(rBot, rTop*0.85, h*0.5, x, h*0.75, z, 16);
  // Joelho/jarrete (esfera articulada)
  if (kneeY) g.sphere(rTop*0.9, x, kneeY, z + rTop*0.3, 10, 8);
  // Perna inferior
  g.frustum(rTop*0.85, rTop*0.65, h*0.5, x, h*0.25, z, 14);
  // Pé com casco duplo (2 toros)
  g.frustum(rBot*1.2, rBot*0.8, h*0.1, x, h*0.05, z - rBot*0.3, 12);
  g.frustum(rBot*1.2, rBot*0.8, h*0.1, x, h*0.05, z + rBot*0.3, 12);
  // Solado (chifre de casco)
  g.cyl(rBot*0.9, h*0.05, x, h*0.0, z, 14);
}

// Cabeça bovina com detalhes
function headBovine(g, s, cx, cy, cz) {
  // Cabeça principal
  g.ellipsoid(0.9*s, 0.85*s, 1.1*s, cx, cy, cz);
  // Focinho (alongado, robusto)
  g.ellipsoid(0.72*s, 0.58*s, 0.75*s, cx, cy-0.35*s, cz+0.82*s);
  // Narinas
  g.sphere(0.12*s, cx-0.22*s, cy+0.05*s, cz+1.25*s, 6, 5);
  g.sphere(0.12*s, cx+0.22*s, cy+0.05*s, cz+1.25*s, 6, 5);
  // Olhos
  g.sphere(0.18*s, cx-0.42*s, cy+0.25*s, cz+0.7*s, 6, 5);
  g.sphere(0.18*s, cx+0.42*s, cy+0.25*s, cz+0.7*s, 6, 5);
  // Chifres curvos (em espiral)
  for (let side of [-1, 1]) {
    let baseX = cx + side*0.42*s;
    let baseY = cy + 0.92*s;
    let baseZ = cz + 0.32*s;
    let prevX = baseX, prevY = baseY, prevZ = baseZ;
    for (let i = 0; i < 6; i++) {
      let t = i / 5;
      let r = 0.12*s * (1 - t*0.4);
      let curve = t * 1.2; // curvatura lateral
      let up = t * 0.9;    // curvatura vertical
      let nx = baseX + side*curve*s*0.4;
      let ny = baseY + up*s;
      let nz = baseZ + side*0.15*s;
      if (i === 0) g.sphere(r*1.3, nx, ny, nz, 6, 5);
      else g.chain(r, prevX, prevY, prevZ, nx-prevX, ny-prevY, nz-prevZ, 4, 0.9);
      prevX = nx; prevY = ny; prevZ = nz;
    }
  }
  // Orelhas grandes e pontiagudas
  g.ellipsoid(0.22*s, 0.55*s, 0.6*s, cx-1.05*s, cy+0.42*s, cz-0.15*s, 12, 10);
  g.ellipsoid(0.22*s, 0.55*s, 0.6*s, cx+1.05*s, cy+0.42*s, cz-0.15*s, 12, 10);
}

// Cabeça de equino
function headEquine(g, s, cx, cy, cz) {
  // Cabeça
  g.ellipsoid(0.65*s, 0.72*s, 1.4*s, cx, cy, cz);
  // Focinho (pequeno, elegante)
  g.ellipsoid(0.52*s, 0.48*s, 0.6*s, cx, cy-0.38*s, cz+0.95*s);
  // Narinas delicadas
  g.sphere(0.08*s, cx-0.22*s, cy+0.02*s, cz+1.35*s, 6, 4);
  g.sphere(0.08*s, cx+0.22*s, cy+0.02*s, cz+1.35*s, 6, 4);
  // Olhos
  g.sphere(0.16*s, cx-0.4*s, cy+0.35*s, cz+0.65*s, 6, 5);
  g.sphere(0.16*s, cx+0.4*s, cy+0.35*s, cz+0.65*s, 6, 5);
  // Orelhas longas e pontiagudas
  g.con(0.14*s, 0.75*s, cx-0.33*s, cy+1.02*s, cz+0.15*s, 10);
  g.con(0.14*s, 0.75*s, cx+0.33*s, cy+1.02*s, cz+0.15*s, 10);
}

// Cabeça de suíno
function headPorine(g, s, cx, cy, cz) {
  // Cabeça arredondada
  g.sphere(1.05*s, cx, cy, cz, 14, 12);
  // Focinho achatado e alongado (característico!)
  g.ellipsoid(0.75*s, 0.45*s, 0.55*s, cx, cy-0.42*s, cz+0.95*s, 14, 8);
  g.ellipsoid(0.58*s, 0.38*s, 0.48*s, cx, cy-0.6*s, cz+1.35*s, 12, 8);
  // Narinas grandes e patetas
  g.sphere(0.15*s, cx-0.28*s, cy-0.45*s, cz+1.75*s, 8, 6);
  g.sphere(0.15*s, cx+0.28*s, cy-0.45*s, cz+1.75*s, 8, 6);
  // Olhos grandes
  g.sphere(0.22*s, cx-0.45*s, cy+0.32*s, cz+0.75*s, 8, 6);
  g.sphere(0.22*s, cx+0.45*s, cy+0.32*s, cz+0.75*s, 8, 6);
  // Oreltas grandes e caídas (característica do porco)
  g.ellipsoid(0.2*s, 0.75*s, 0.55*s, cx-0.95*s, cy+0.15*s, cz+0.45*s, 14, 10);
  g.ellipsoid(0.2*s, 0.75*s, 0.55*s, cx+0.95*s, cy+0.15*s, cz+0.45*s, 14, 10);
}

// Cabeça de ave
function headAve(g, s, cx, cy, cz) {
  g.sphere(0.62*s, cx, cy, cz, 12, 10);
  // Bico alongado
  g.con(0.18*s, 0.65*s, cx, cy-0.15*s, cz+0.75*s, 8);
  g.con(0.14*s, 0.35*s, cx, cy-0.1*s, cz+1.35*s, 8);
  // Narina
  g.sphere(0.05*s, cx, cy-0.05*s, cz+1.65*s, 6, 4);
  // Olhos
  g.sphere(0.14*s, cx-0.32*s, cy+0.18*s, cz+0.45*s, 6, 5);
  g.sphere(0.14*s, cx+0.32*s, cy+0.18*s, cz+0.45*s, 6, 5);
  // Crista
  g.sphere(0.16*s, cx, cy+0.75*s, cz, 8, 6);
  g.sphere(0.21*s, cx-0.15*s, cy+0.82*s, cz+0.12*s, 8, 6);
  g.sphere(0.21*s, cx+0.15*s, cy+0.82*s, cz-0.12*s, 8, 6);
  // Barbela (wattle)
  g.sphere(0.18*s, cx-0.18*s, cy-0.05*s, cz+0.45*s, 8, 6);
  g.sphere(0.18*s, cx+0.18*s, cy-0.05*s, cz+0.45*s, 8, 6);
  g.ellipseRing(0.08*s, cx, cy-0.35*s, cz+0.55*s, 8);
}

// Cabeça de ovino
function headOvine(g, s, cx, cy, cz) {
  g.sphere(0.75*s, cx, cy, cz, 12, 10);
  // Focinho curto
  g.ellipsoid(0.58*s, 0.48*s, 0.52*s, cx, cy-0.38*s, cz+0.78*s, 12, 8);
  // Narinas
  g.sphere(0.1*s, cx-0.2*s, cy-0.22*s, cz+1.15*s, 6, 5);
  g.sphere(0.1*s, cx+0.2*s, cy-0.22*s, cz+1.15*s, 6, 5);
  // Olhos
  g.sphere(0.16*s, cx-0.34*s, cy+0.25*s, cz+0.55*s, 6, 5);
  g.sphere(0.16*s, cx+0.34*s, cy+0.25*s, cz+0.55*s, 6, 5);
  // Orelhas caídas
  g.ellipsoid(0.15*s, 0.4*s, 0.45*s, cx-0.85*s, cy-0.05*s, cz+0.35*s, 12, 8);
  g.ellipsoid(0.15*s, 0.4*s, 0.45*s, cx+0.85*s, cy-0.05*s, cz+0.35*s, 12, 8);
  // Chifres curvados (em espiral)
  for (let side of [-1, 1]) {
    let baseX = cx + side*0.38*s;
    let baseY = cy + 0.88*s;
    let baseZ = cz + 0.18*s;
    for (let i = 0; i < 5; i++) {
      let t = i / 4;
      let r = 0.11*s * (1 - t*0.5);
      let curveX = baseX + side * t * 0.45 * s;
      let curveZ = baseZ + side * t * t * 0.35 * s;
      let curveY = baseY + t * 0.65 * s;
      g.sphere(r*1.4, curveX, curveY, curveZ, 6, 5);
      if (i > 0) {
        let prevT = (i-1) / 4;
        let pr = 0.11*s * (1 - prevT*0.5);
        let px = baseX + side * prevT * 0.45 * s;
        let pz = baseZ + side * prevT * prevT * 0.35 * s;
        let py = baseY + prevT * 0.65 * s;
        g.chain(Math.max(r, pr)*0.9, px, py, pz, curveX-px, curveY-py, curveZ-pz, 4, 0.85);
      }
    }
  }
  // Barba (para machos)
  g.chain(0.08*s, cx-0.2*s, cy-0.5*s, cz+0.6*s, 0, -0.3*s, 0, 3, 0.7);
  g.chain(0.08*s, cx+0.2*s, cy-0.5*s, cz+0.6*s, 0, -0.3*s, 0, 3, 0.7);
}

// Pescoço arqueado com músculos
function neckArc(g, s, startX, startY, startZ, endX, endY, endZ, baseR, nSeg=5) {
  for (let i = 0; i < nSeg; i++) {
    let t = i / (nSeg-1 || 1);
    let nx = startX + (endX-startX)*t;
    let ny = startY + (endY-startY)*t + Math.sin(t*Math.PI)*0.4*s; // curvatura
    let nz = startZ + (endZ-startZ)*t;
    let r = baseR * (1 - t*0.15);
    g.sphere(r, nx, ny, nz, 12, 8);
  }
}

// Udder bovino com 4 tetos
function udder(g, s, cx, cy, cz) {
  g.ellipsoid(0.6*s, 0.45*s, 0.7*s, cx, cy, cz);
  for (let [dx, dz] of [[-0.22*s, -0.08*s],[0.22*s, -0.08*s],[-0.22*s, 0.08*s],[0.22*s, 0.08*s]]) {
    g.con(0.08*s, 0.42*s, cx+dx, cy-0.18*s, cz+dz, 6);
  }
}

  g.ellipsoid(2.3*s, 1.2*s, 1.1*s, 0, 4.2*s, 0);        // lomo

  udder(g, s, 0, 1.7*s, -0.82*s);

  quadLeg(g, -1.3*s, 1.95*s, 2.6*s, 0.65*s, 0.4*s, 1.75*s, s);

  neckArc(g, s, 0, 4.5*s, 1.95*s, 0, 5.8*s, 3.1*s, 1.1*s, 4);

  // Cabeça detalhada
  headBovine(g, s, 0, 6.0*s, 3.7*s);

  g.frustum(0.15*s, 0.08*s, 2.2*s, 0, 3.5*s, -3.05*s, 10);

function genEquine(s) {
  let g = new Gen();
  // Tronco atlético (longo e musculoso)
  g.ellipsoid(1.75*s, 1.85*s, 3.2*s, 0, 3.9*s, -0.3*s);
  g.ellipsoid(1.6*s, 1.65*s, 1.3*s, 0, 4.0*s, 2.1*s);  // peito
  g.ellipsoid(1.6*s, 1.65*s, 1.3*s, 0, 4.0*s, -2.4*s); // garupa

  quadLeg(g, -0.95*s, 2.4*s, 3.4*s, 0.52*s, 0.28*s, 2.0*s, s);

  neckArc(g, s, 0, 5.0*s, 1.8*s, 0, 6.4*s, 3.4*s, 1.1*s, 5);

  // Cabeça longa
  headEquine(g, s, 0, 6.9*s, 3.4*s);

  // Crina (densinha, cadeia de esferas ao longo do pescoço)
  for (let i = 0; i < 35; i++) {
    let t = i / 34;
    let py = 5.0*s + t * 1.4*s;
    let pz = 1.8*s + Math.sin(t*Math.PI) * 0.4*s;
    let r = 0.16*s * (1 - t*0.2);
    let s2 = 0.55*s;
    let offset = Math.cos(t*Math.PI) * 0.12*s;
    g.chain(r, offset, py, pz, 0, 0.06*s, 0, 3, 0.75);
    // Cabelos individuais mais longos
    if (i % 3 === 0) {
      g.chain(0.06*s, offset*0.7, py + 0.15*s, pz, 0, 0.25*s, 0.1*s, 4, 0.6);
    }
  }

  // Rabo com crina inferior
  g.chain(0.06*s, 0, 4.2*s, -3.4*s, 0, -1.2*s, 0.3*s, 8, 0.7);
  g.chain(0.05*s, 0, 3.5*s, -3.2*s, 0, -0.8*s, 0.5*s, 6, 0.6);

  return g;
}

function genPorine(s) {
  let g = new Gen();
  // Corpo gordo e arredondado
  g.ellipsoid(2.5*s, 1.9*s, 2.8*s, 0, 2.9*s, 0);
  g.ellipsoid(2.3*s, 1.7*s, 1.3*s, 0, 3.0*s, 1.95*s);  // peito
  // Linha do ventre (curvatura inferior)
  g.ellipsoid(2.4*s, 1.3*s, 2.0*s, 0, 1.8*s, 0);       // ventre

  // 4 patas curtas e robustas
  quadLeg(g, -1.5*s, 1.6*s, 1.8*s, 0.65*s, 0.46*s, 0, s);
  quadLeg(g, 1.5*s, 1.6*s, 1.8*s, 0.65*s, 0.46*s, 0, s);
  quadLeg(g, -1.5*s, -1.6*s, 1.8*s, 0.65*s, 0.46*s, 0, s);
  quadLeg(g, 1.5*s, -1.6*s, 1.8*s, 0.65*s, 0.46*s, 0, s);

  // Cabeça com focinho achatado (característico)
  headPorine(g, s, 0, 3.4*s, 2.5*s);

  // Rabo em ESPÍRAL (marcante!)
  let baseY = 3.1*s;
  let baseZ = -2.65*s;
  let cx = 0, prevY = baseY, prevZ = baseZ;
  for (let i = 0; i < 30; i++) {
    let t = i / 29;
    let ang = t * 4.5 * Math.PI; // ~2¼ voltas
    let r = 0.32*s * (1 - t*0.3);
    let ny = baseY - 0.2*s + r * Math.sin(ang) * 0.85;
    let nz = baseZ - 0.15*s - t*0.12*s;
    g.sphere(0.11*s * (1-t*0.2), cx, ny, nz, 7, 5);
    if (i > 0) {
      let pr = 0.32*s * (1 - (i-1)/29*0.3);
      let py = baseY - 0.2*s + pr * Math.sin((i-1)/29 * 4.5 * Math.PI) * 0.85;
      g.chain(0.11*s, cx, py, prevZ, 0, ny-py, nz-prevZ, 4, 0.8);
    }
    prevY = ny; prevZ = nz;
  }

  return g;
}

function genAve(s) {
  let g = new Gen();
  // Corpo (ovo, arredondado)
  g.ellipsoid(1.5*s, 1.6*s, 2.0*s, 0, 3.0*s, 0);
  // Peito
  g.sphere(1.0*s, 0, 2.7*s, 0.9*s, 14, 12);
  // Barriga (menos arredada)
  g.ellipsoid(1.5*s, 1.3*s, 1.7*s, 0, 2.3*s, 0.3*s);

  // Pescoço
  g.chain(0.42*s, 0, 3.3*s, 0.95*s, 0, 0.8*s, 0.35*s, 5, 0.75);

  // Cabeça
  headAve(g, s, 0, 4.05*s, 1.25*s);

  // Asa (detalhada, com múltiplas penas)
  for (let wing = -1; wing <= 1; wing += 2) {
    let wx = wing * 1.45*s;
    // Primeira pena da asa (granjo)
    g.ellipsoid(0.16*s, 0.72*s, 0.3*s, wx, 2.9*s, 0.05*s);
    // Penas da asa (primárias)
    for (let i = 0; i < 6; i++) {
      let py = 2.5*s - i*0.28*s;
      let pz = i*0.35*s;
      let r = 0.14*s;
      let len = 0.7*s - i*0.05*s;
      let ang = wing * 0.35;
      g.frustum(r*0.7, r*0.5, len*0.5, wx, py, pz, 6);
    }
  }

  // Rabo em leque (penas individuais)
  for (let i = -6; i <= 6; i++) {
    let seg = Math.abs(i);
    let r = 0.14*s - seg*0.06*s;
    let len = 0.8*s - seg*0.05*s;
    let zangle = 0.25 + seg*0.1;
    g.frustum(r, r*0.3, len, Math.cos(i*0.25)*0.25*s, 4.3*s + seg*0.15*s, -1.4*s, 8);
  }

  // Pernas de galinha (4 patas, duas na frente duas atrás)
  for (let side of [-1, 1]) {
    // Perna dianteira
    g.cyl(0.14*s, 1.6*s, side*0.5*s, 0.9*s, 0.55*s, 8);
    // Pé com 3 garras
    g.ellipseRing(0.34*s, side*0.5*s, 0.15*s, 0.75*s, 16);
    // Garras detalhadas
    for (let g = 0; g < 3; g++) {
      let ang = (g - 1) * 0.18;
      let gx = side*0.5*s + Math.sin(ang)*0.18*s;
      let gz = 0.75*s + Math.cos(ang)*0.22*s;
      g.frustum(0.05*s, 0.02*s, 0.4*s, gx, -0.05*s, gz, 6);
    }
    // Perna traseira
    g.cyl(0.15*s, 1.65*s, side*0.6*s, 0.3*s, -0.5*s, 8);
    g.ellipseRing(0.32*s, side*0.6*s, 0.14*s, -0.38*s, 16);
    for (let gg = 0; gg < 3; gg++) {
      let ang = (gg - 1) * 0.18;
      let gx = side*0.6*s + Math.sin(ang)*0.16*s;
      let gz = -0.38*s + Math.cos(ang)*0.2*s;
      g.frustum(0.045*s, 0.018*s, 0.38*s, gx, -0.05*s, gz, 6);
    }
  }

  return g;
}

function genOvine(s) {
  let g = new Gen();
  // Corpo lã (núcleo)
  g.ellipsoid(2.1*s, 2.0*s, 2.85*s, 0, 3.5*s, 0);

  let woolBumps = [
    [-1.5, 4.4, 1.3, 0.88],[-1.5, 4.5, -1.3, 0.88],[1.5, 4.4, 1.3, 0.88],[1.5, 4.5, -1.3, 0.88],
    [-1.7, 3.4, 0.7, 0.82],[1.7, 3.4, 0.7, 0.82],[-1.7, 3.4, -0.7, 0.82],[1.7, 3.4, -0.7, 0.82],

    [0, 5.4, 0, 0.95],
    [-2.0, 4.0, 0, 0.85],[2.0, 4.0, 0, 0.85],
    [-1.3, 4.7, 0.9, 0.82],[1.3, 4.7, 0.9, 0.82],
    [-1.3, 4.7, -0.9, 0.82],[1.3, 4.7, -0.9, 0.82],
    [0, 4.0, 2.4, 0.8],[0, 4.0, -2.4, 0.8],
    [-0.8, 4.3, 2.1, 0.78],[0.8, 4.3, 2.1, 0.78],
    [-0.8, 4.3, -2.1, 0.78],[0.8, 4.3, -2.1, 0.78],
    [-1.1, 3.7, 1.9, 0.8],[1.1, 3.7, 1.9, 0.8],
  ];
  for (let [bx, by, bz, br] of woolBumps) g.sphere(br*s, bx*s, by*s, bz*s, 9, 7);

  // Pernas longas e finas
  quadLeg(g, -1.05*s, 1.6*s, 2.5*s, 0.42*s, 0.26*s, 0, s);

  quadLeg(g, 1.05*s, -1.6*s, 2.5*s, 0.42*s, 0.26*s, 0, s);

  // Cabeça pequena
  headOvine(g, s, 0, 5.1*s, 2.7*s);

  // Rabo curto
  g.sphere(0.4*s, 0, 3.9*s, -2.8*s, 8, 6);

  return g;
}

    let wx = wing * 1.45*s;
    t.ellipsoid(0.16*s, 0.72*s, 0.3*s, wx, 2.9*s, 0.05*s);
    for (let i = 0; i < 6; i++) {
      let py = 2.5*s - i*0.28*s;
      let pz = i*0.35*s;
      let r = 0.14*s * wing;
      t.frustum(0.1*s, 0.07*s, 0.35*s, wx, py, pz, 6);
    }
  }
  // Rabo em leque
  for (let i = -4; i <= 4; i++) {
    let seg = Math.abs(i);
    let r = 0.12*s - seg*0.05*s;
    let len = 0.6*s - seg*0.05*s;
    t.frustum(Math.max(r,0.03*s), r*0.4, len, Math.cos(i*0.3)*0.25*s, 4.3*s + seg*0.15*s, -1.4*s, 8);
  }
  // Pernas
  for (let side of [-1, 1]) {
    t.cyl(0.14*s, 1.6*s, side*0.5*s, 0.9*s, 0.55*s, 8);
    t.ellipseRing(0.34*s, side*0.5*s, 0.15*s, 0.75*s, 16);
    t.cyl(0.15*s, 1.65*s, side*0.6*s, 0.3*s, -0.5*s, 8);
    t.ellipseRing(0.32*s, side*0.6*s, 0.14*s, -0.38*s, 16);
  }
  parts.push({name:"01_tronco", desc:"Corpo, asas, rabo, pernas, pescoço", g:t});

  let h = new Gen();
  headAve(h, s, 0, 0, 0.2*s);
  h.joint(0.34*s, 0, -0.9*s, -0.15*s);
  parts.push({name:"02_cabeca", desc:"Cabeça com bico, crista, barbela", g:h});
  return parts;
}

function partsOvine(s) {
  let parts = [];

  let t = new Gen();
  t.ellipsoid(2.1*s, 2.0*s, 2.85*s, 0, 3.5*s, 0);
  t.ellipsoid(2.0*s, 1.85*s, 1.4*s, 0, 3.6*s, 1.9*s);
  t.ellipsoid(2.0*s, 1.85*s, 1.4*s, 0, 3.6*s, -1.9*s);
  // Lã (tufos)
  let woolBumps = [
    [-1.5, 4.4, 1.3, 0.88],[-1.5, 4.5, -1.3, 0.88],[1.5, 4.4, 1.3, 0.88],[1.5, 4.5, -1.3, 0.88],
    [-1.7, 3.4, 0.7, 0.82],[1.7, 3.4, 0.7, 0.82],[-1.7, 3.4, -0.7, 0.82],[1.7, 3.4, -0.7, 0.82],
    [0, 5.1, 2.1, 0.88],[0, 5.1, -2.1, 0.88],[0, 5.4, 0, 0.95],
    [-2.0, 4.0, 0, 0.85],[2.0, 4.0, 0, 0.85],
    [-1.3, 4.7, 0.9, 0.82],[1.3, 4.7, 0.9, 0.82],
    [-1.3, 4.7, -0.9, 0.82],[1.3, 4.7, -0.9, 0.82],
    [0, 4.0, 2.4, 0.8],[0, 4.0, -2.4, 0.8],
    [-1.1, 3.7, 1.9, 0.8],[1.1, 3.7, 1.9, 0.8],
  ];
  for (let [bx, by, bz, br] of woolBumps) t.sphere(br*s, bx*s, by*s, bz*s, 9, 7);
  t.joint(0.5*s, 0, 5.3*s, 2.6*s);
  t.sphere(0.4*s, 0, 3.9*s, -2.8*s);
  parts.push({name:"01_tronco", desc:"Corpo com lã detalhada + rabo", g:t});

  let h = new Gen();
  headOvine(h, s, 0, 0, 0.25*s);
  h.joint(0.38*s, 0, -0.8*s, 0.15*s);
  parts.push({name:"02_cabeca", desc:"Cabeça com chifres em espiral, orelhas, barba", g:h});

  let legData = [
    ["03_pata_fe","Pata frontal ESQ",-1.05*s, 1.6*s],
    ["04_pata_fd","Pata frontal DIR",1.05*s, 1.6*s],
    ["05_pata_te","Pata traseira ESQ",-1.05*s, -1.6*s],
    ["06_pata_td","Pata traseira DIR",1.05*s, -1.6*s]
  ];
  for (let [pn, pd, lx, lz] of legData) {
    let lg = new Gen();
    lg.joint(0.38*s, 0, 0.95*s, 0);
    lg.frustum(0.24*s, 0.36*s, 1.5*s, 0, 0.1*s, 0, 12);
    lg.frustum(0.27*s, 0.31*s, 0.18*s, 0, -0.65*s, 0, 12);
    parts.push({name: pn, desc: pd, g: lg});
  }
  return parts;
}

const SOLIDS = { bovino: genBovine, equino: genEquine, suino: genPorine, ave: genAve, ovino: genOvine };
const PARTS  = { bovino: partsBovine, equino: partsEquine, suino: partsPorine, ave: partsAve, ovino: partsOvine };

/* =====================================================================
   THREE.JS VIEWER
   ===================================================================== */
const viewer = document.getElementById('viewer');
const canvasEl = document.getElementById('viewer-canvas');
const loadingEl = document.getElementById('loading');
const statusText = document.getElementById('status-text');
const progressBar = document.getElementById('progress-bar');

let scene, camera, renderer, controls, currentGroup;
let jointDiameter = 3;

function initThree() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0xf0f2f5);
  scene.fog = new THREE.FogExp2(0xf0f2f5, 0.002);

  camera = new THREE.PerspectiveCamera(45, viewer.clientWidth / viewer.clientHeight, 0.1, 500);
  camera.position.set(35, 22, 35);

  renderer = new THREE.WebGLRenderer({ canvas: canvasEl, antialias: true });
  renderer.setSize(viewer.clientWidth, viewer.clientHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCSM;

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.enablePan = true;
  controls.minDistance = 8;
  controls.maxDistance = 200;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.8;
  controls.addEventListener('start', () => controls.autoRotate = false);

  // Iluminação
  scene.add(new THREE.AmbientLight(0xffffff, 0.45));
  let dir = new THREE.DirectionalLight(0xffffff, 0.9);
  dir.position.set(35, 55, 25);
  dir.castShadow = true;
  dir.shadow.mapSize.width = 2048;
  dir.shadow.mapSize.height = 2048;
  dir.shadow.camera.left = -45; dir.shadow.camera.right = 45;
  dir.shadow.camera.top = 60; dir.shadow.camera.bottom = -30;
  dir.shadow.camera.near = 0.5; dir.shadow.camera.far = 200;
  scene.add(dir);

  // Chão
  let gr = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.ShadowMaterial({opacity: 0.15}));
  gr.rotation.x = -Math.PI/2; gr.position.y = -0.1; gr.receiveShadow = true;
  scene.add(gr);
  let grid = new THREE.GridHelper(140, 40, 0xbbbbbb, 0xe0e0e0);
  grid.position.y = -0.05;
  scene.add(grid);

  animate();
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  let w = viewer.clientWidth, h = viewer.clientHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});

function showLoading(v, msg="Gerando modelo 3D…") {
  loadingEl.innerHTML = v ? `<div class="spinner-border spinner-border-sm text-primary mb-2" role="status"></div><div>${msg}</div>` : '';
  loadingEl.style.display = v ? 'block' : 'none';
}
function updateStatus(t, pct=100) {
  statusText.textContent = t;
  progressBar.style.width = pct + '%';
  progressBar.className = 'progress-bar bg-' + (pct === 100 ? 'success' : 'primary');
}
function showError(msg) {
  statusText.textContent = 'Erro: ' + msg;
  progressBar.style.width = '100%';
  progressBar.className = 'progress-bar bg-danger';
  console.error(msg);
}

function makeMaterial(color = 0x8b7355) {
  return new THREE.MeshStandardMaterial({
    color: color, metalness: 0.02, roughness: 0.78,
  });
}

function clearCurrent() {
  if (currentGroup) {
    scene.remove(currentGroup);
    currentGroup.traverse(o => { if (o.geometry) o.geometry.dispose(); });
    currentGroup = null;
  }
}

function frameCamera(group) {
  let box = new THREE.Box3().setFromObject(group);
  let center = box.getCenter(new THREE.Vector3());
  let size = box.getSize(new THREE.Vector3());
  let max = Math.max(size.x, size.y, size.z);
  let dist = max * 1.8;
  controls.target.set(center.x, Math.max(center.y, 3), center.z);
  camera.position.set(center.x + dist*0.9, center.y + dist*0.6, center.z + dist*0.9);
  controls.update();
}

function showSolid(gen) {
  showLoading(true, "Gerando modelo 3D…");
  updateStatus("Visualizando animal…", 70);
  setTimeout(() => {
    try {
      clearCurrent();
      let geo = gen.toGeometry();
      currentGroup = new THREE.Group();
      let m = new THREE.Mesh(geo, makeMaterial());
      m.castShadow = true; m.receiveShadow = true;
      let box = new THREE.Box3().setFromObject(m);
      let center = box.getCenter(new THREE.Vector3());
      m.position.sub(center);
      currentGroup.add(m);
      scene.add(currentGroup);
      frameCamera(currentGroup);
      updateStatus("Modelo 3D gerado com sucesso", 100);
      showLoading(false);
    } catch(e) { console.error(e); showError(e.message); showLoading(false); }
  }, 50);
}

function showParts(parts) {
  showLoading(true, "Montando peças…");
  updateStatus("Preparando peças articuladas…", 60);
  setTimeout(() => {
    try {
      clearCurrent();
      currentGroup = new THREE.Group();
      let mat = makeMaterial();
      let n = parts.length;
      for (let i = 0; i < n; i++) {
        let p = parts[i];
        let geo = p.g.toGeometry();
        let m = new THREE.Mesh(geo, mat);
        m.castShadow = true; m.receiveShadow = true;
        let box = new THREE.Box3().setFromObject(m);
        let center = box.getCenter(new THREE.Vector3());
        m.position.sub(center);
        let angle = i / n * Math.PI * 2;
        let radius = n > 3 ? 18 : 9;
        m.position.x += Math.cos(angle) * radius;
        m.position.z += Math.sin(angle) * radius;
        m.rotation.y = -angle;
        currentGroup.add(m);
      }
      scene.add(currentGroup);
      frameCamera(currentGroup);
      updateStatus("Peças visualizadas (" + n + " peças)", 100);
      showLoading(false);
    } catch(e) { console.error(e); showError(e.message); showLoading(false); }
  }, 50);
}

/* ========= Ações ========= */
function getVals() {
  return {
    animal: document.getElementById('animal').value,
    scale: parseFloat(document.getElementById('scale').value) || 10,
    tipo: document.querySelector('input[name="tipo"]:checked').value
  };
}

function regenerate() {
  let v = getVals();
  if (v.tipo === 'solido') {
    showSolid(SOLIDS[v.animal](v.scale));
  } else {
    showParts(PARTS[v.animal](v.scale));
  }
}

function downloadSTL() {
  let v = getVals();
  let buf = SOLIDS[v.animal](v.scale).toSTL(v.animal);
  let blob = new Blob([buf], {type: 'application/octet-stream'});
  let url = URL.createObjectURL(blob);
  let a = document.createElement('a');
  a.href = url;
  a.download = `${v.animal}_solido_${Math.round(v.scale*10)}mm.stl`;
  a.click();
  URL.revokeObjectURL(url);
  updateStatus("STL baixado!", 100);
}

async function downloadZIP() {
  let v = getVals();
  let JSZip = await import('https://cdn.jsdelivr.net/npm/jszip@3.10.1/+esm');
  let zip = new (JSZip.default || JSZip)();
  let parts = PARTS[v.animal](v.scale);

  let guide = `ANIMAL ARTICULADO - ${v.animal.toUpperCase()}\n`;
  guide += `=======================================================\n\n`;
  guide += `Escala: ${v.scale} mm\n`;
  guide += `Junta (bola): ${jointDiameter} mm diâmetro\n`;
  guide += `Total de peças: ${parts.length}\n\n`;
  guide += `PEÇAS:\n`;
  for (let p of parts) guide += `  - ${p.name}.stl: ${p.desc}\n`;
  guide += `\nMONTAGEM:\n`;
  guide += `  1. Tronco: base central\n`;
  guide += `  2. Cabeça: encaixe a bola no soquete do pescoço\n`;
  guide += `  3. Patas: encaixe as bolas nas posições laterais\n`;
  guide += `  - Folga de impressão: 0.15-0.2mm por lado\n`;
  guide += `  - Materiais: PLA ou PETG · 20% infill · 0.2mm camada\n`;
  guide += `  - Sem suportes necessários para a maioria das peças\n`;

  zip.file('00_GUIA_MONTAGEM.txt', guide);
  for (let p of parts) zip.file(`${p.name}.stl`, p.g.toSTL(p.name));

  let blob = await zip.generateAsync({type: 'blob'});
  let url = URL.createObjectURL(blob);
  let a = document.createElement('a');
  a.href = url;
  a.download = `${v.animal}_articulado_${Math.round(v.scale*10)}mm.zip`;
  a.click();
  URL.revokeObjectURL(url);
  updateStatus("ZIP baixado!", 100);
}

document.getElementById('btn-view').addEventListener('click', regenerate);
document.getElementById('btn-stl').addEventListener('click', () => { downloadSTL(); regenerate(); });
document.getElementById('btn-zip').addEventListener('click', () => { downloadZIP(); regenerate(); });

document.getElementById('animal').addEventListener('change', regenerate);
document.getElementById('scale').addEventListener('input', () => {
  clearTimeout(window._deb);
  window._deb = setTimeout(regenerate, 400);
});
document.getElementById('joint').addEventListener('input', () => { jointDiameter = parseFloat(document.getElementById('joint').value) || 3; });

document.querySelectorAll('input[name="tipo"]').forEach(r => {
  r.addEventListener('change', () => {
    document.getElementById('joint-field').style.display = (r.value === 'articulado') ? 'block' : 'none';
    regenerate();
  });
});

initThree();
regenerate();
</script>
