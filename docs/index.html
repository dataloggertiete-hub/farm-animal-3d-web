<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gerador 3D de Animais - Detalhe Anatômico Máximo</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body { background:#e8eaf6; margin:0; font-family:'Segoe UI',sans-serif; }
  .container-fluid { max-width:1500px; }
  .card { box-shadow:0 4px 15px rgba(0,0,0,.08); border:none; border-radius:10px; }
  #viewer { width:100%; height:620px; border-radius:10px; position:relative; overflow:hidden; }
  #viewer canvas { display:block; width:100%; height:100%; }
  .loading-overlay { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
             background:rgba(255,255,255,.95); padding:1.2rem 1.8rem; border-radius:10px; display:none; z-index:10;
             box-shadow:0 4px 20px rgba(0,0,0,.2); text-align:center; }
  .spinner-border { width:1.8rem; height:1.8rem; }
  .error-popup { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
                background:rgba(220,53,69,.95); color:#fff; padding:1rem 1.5rem; border-radius:8px;
                display:none; z-index:10; }
  .form-label { font-weight:600; }
  .small-muted { color:#6c757d; }
  .anatomy-badge { background:#e7f5ff; color:#1971c2; padding:2px 8px; border-radius:10px; font-size:0.7rem; }
  .detail-item { display:flex; align-items:center; gap:6px; margin-bottom:2px; font-size:0.78rem; }
  .detail-dot { width:6px; height:6px; border-radius:50%; background:#4cc9f0; }
</style>
</head>
<body>

<div class="container-fluid py-4 px-3 px-lg-4">
  <div class="row g-4">
    <!-- Painel de Controle -->
    <div class="col-12 col-lg-3 order-2 order-lg-1">
      <div class="card mb-4">
        <div class="card-body p-3">
          <h1 class="h5 mb-1 fw-bold">🦙🐄 Animal 3D Studio</h1>
          <p class="small-muted mb-3">Modelos anatômicos realistas para impressão 3D</p>

          <div class="mb-3">
            <label class="form-label">🐄 Espécie</label>
            <select id="animal" class="form-select form-select-sm">
              <option value="bovino">🐄 Bovino (Vaca/Touro)</option>
              <option value="equino">🐴 Equino (Cavalo/Passo)</option>
              <option value="suino">🐷 Suíno (Porco)</option>
              <option value="ave">🐓 Galinha (Galo/Galinha)</option>
              <option value="ovino">🐑 Ovino (Ovelha/Carneiro)</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">📐 Escala: <span id="scaleVal">10</span> mm</label>
            <input type="range" id="scale" class="form-range" value="10" min="5" max="20" step="0.5">
            <div class="small-muted">~10×5×7 cm na mão</div>
          </div>

          <div class="mb-3">
            <label class="form-label">🛠️ Tipo de modelo</label>
            <div class="form-check py-1">
              <input class="form-check-input" type="radio" name="tipo" value="solido" checked id="t-solido">
              <label class="form-check-label small" for="t-solido">Sólido (1 peça)</label>
            </div>
            <div class="form-check py-1">
              <input class="form-check-input" type="radio" name="tipo" value="articulado" id="t-art">
              <label class="form-check-label small" for="t-art">Articulado (múltiplas peças)</label>
            </div>
          </div>

          <div class="mb-3" id="joint-field" style="display:none;">
            <label class="form-label">🔩 Diâmetro da junta: <span id="jointVal">3</span> mm</label>
            <input type="range" id="joint" class="form-range" value="3" min="1" max="8" step="0.5">
          </div>

          <div class="d-grid gap-2 pt-2">
            <button id="btn-view" class="btn btn-primary btn-sm py-2 fw-semibold">🔄 Gerar no 3D</button>
            <button id="btn-stl" class="btn btn-outline-success btn-sm py-2">📥 STL (Sólido)</button>
            <button id="btn-zip" class="btn btn-outline-dark btn-sm py-2">📥 ZIP (Articulado)</button>
          </div>

          <div class="mt-3 pt-2 border-top">
            <div class="d-flex justify-content-between small fw-medium text-primary mb-1">
              <span>Detalhes Anatômicos</span><span id="animal-tag" class="anatomy-badge">Bovino</span>
            </div>
            <div id="anatomy-list" class="small"></div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-body p-3">
          <div id="status-text" class="small mb-2 fw-medium">Pronto para gerar</div>
          <div class="progress" style="height:5px;">
            <div id="progress-bar" class="progress-bar bg-success" style="width:100%"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Visualizador 3D -->
    <div class="col-12 col-lg-9 order-1 order-lg-2">
      <div class="card h-100">
        <div class="card-header bg-white px-3 py-2 d-flex justify-content-between align-items-center">
          <h6 class="mb-0 fw-semibold">🖥️ Visualizador 3D - WebGL</h6>
          <div class="small text-muted">OrbitControls activado</div>
        </div>
        <div class="card-body p-0">
          <div id="viewer">
            <canvas id="viewer-canvas"></canvas>
            <div class="loading-overlay" id="loading">
              <div class="spinner-border text-primary mb-2" role="status"></div>
              <div class="fw-medium">Gerando modelo anatômico...</div>
              <div class="small text-muted mt-1">Construindo geometria detalhada</div>
            </div>
            <div class="error-popup" id="errorbox"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* =====================================================================
   GERADOR DE GEOMETRIA - Precisão Anatômica Máxima
   Coordenadas: Y=altura(cima), Z=frente, X=lateral. Solo Y=0.
   ===================================================================== */
class Gen {
  constructor(){ this.v = []; }

  tri(a, b, c) {
    let ax=a[0], ay=a[1], az=a[2];
    let bx=b[0]-ax, by=b[1]-ay, bz=b[2]-az;
    let cx=c[0]-ax, cy=c[1]-ay, cz=c[2]-az;
    let nx = by*cz - bz*cy;
    let ny = bz*cx - bx*cz;
    let nz = bx*cy - by*cx;
    let len = Math.sqrt(nx*nx+ny*ny+nz*nz);
    if(len) { nx/=len; ny/=len; nz/=len; }
    this.v.push(nx, ny, nz, ax, ay, az, b[0], b[1], b[2], c[0], c[1], c[2]);
  }

  // Elipsoide
  ellipsoid(rx, ry, rz, cx=0, cy=0, cz=0, seg=22, ring=16) {
    for (let i = 0; i < ring; i++) {
      let la0 = Math.PI * (-0.5 + i / ring);
      let la1 = Math.PI * (-0.5 + (i+1) / ring);
      for (let j = 0; j < seg; j++) {
        let lo0 = 2 * Math.PI * j / seg;
        let lo1 = 2 * Math.PI * (j+1) / seg;
        let p = [];
        for (let la of [la0, la1])
          for (let lo of [lo0, lo1])
            p.push([
              rx * Math.cos(la) * Math.cos(lo) + cx,
              ry * Math.sin(la) + cy,
              rz * Math.cos(la) * Math.sin(lo) + cz
            ]);
        this.tri(p[0], p[2], p[1]);
        this.tri(p[1], p[2], p[3]);
      }
    }
  }

  sphere(r, cx=0, cy=0, cz=0, seg=14, ring=10) {
    this.ellipsoid(r, r, r, cx, cy, cz, seg, ring);
  }

  // Tronco de cone/cilindro
  frustum(rBot, rTop, h, cx=0, cy=0, cz=0, seg=18) {
    let hh = h/2;
    for (let i = 0; i < seg; i++) {
      let a0 = 2*Math.PI*i/seg, a1 = 2*Math.PI*(i+1)/seg;
      this.tri(
        [rBot*Math.cos(a0)+cx, cy-hh, rBot*Math.sin(a0)+cz],
        [rBot*Math.cos(a1)+cx, cy-hh, rBot*Math.sin(a1)+cz],
        [rTop*Math.cos(a1)+cx, cy+hh, rTop*Math.sin(a1)+cz]
      );
      this.tri(
        [rBot*Math.cos(a0)+cx, cy-hh, rBot*Math.sin(a0)+cz],
        [rTop*Math.cos(a1)+cx, cy+hh, rTop*Math.sin(a1)+cz],
        [rTop*Math.cos(a0)+cx, cy+hh, rTop*Math.sin(a0)+cz]
      );
    }
    if (rTop > 0.0005)
      for (let i = 0; i < seg; i++) {
        let a0 = 2*Math.PI*i/seg, a1 = 2*Math.PI*(i+1)/seg;
        this.tri([cx,cy+hh,cz],
                 [rTop*Math.cos(a0)+cx, cy+hh, rTop*Math.sin(a0)+cz],
                 [rTop*Math.cos(a1)+cx, cy+hh, rTop*Math.sin(a1)+cz]);
      }
    if (rBot > 0.0005)
      for (let i = 0; i < seg; i++) {
        let a0 = 2*Math.PI*i/seg, a1 = 2*Math.PI*(i+1)/seg;
        this.tri([cx,cy-hh,cz],
                 [rBot*Math.cos(a1)+cx, cy-hh, rBot*Math.sin(a1)+cz],
                 [rBot*Math.cos(a0)+cx, cy-hh, rBot*Math.sin(a0)+cz]);
      }
  }

  cyl(r, h, cx=0, cy=0, cz=0, seg=16) { this.frustum(r, r, h, cx, cy, cz, seg); }
  con(r, h, cx=0, cy=0, cz=0, seg=14) { this.frustum(r, 0.01, h, cx, cy, cz, seg); }
  joint(r, cx=0, cy=0, cz=0) { this.sphere(r, cx, cy, cz, 12, 8); }

  // Cadeia de esferas alongada (para pelos, crinas, rabo)
  chain(r, cx, cy, cz, dx, dy, dz, n=8, taper=0.85) {
    for (let i = 0; i < n; i++) {
      let t = i / (n-1 || 1);
      let r2 = r * (1 - t*(1-taper));
      this.sphere(r2, cx + dx*t, cy + dy*t, cz + dz*t, 8, 6);
    }
  }

  // Círculo de esferas (para barbas, bigode)
  ring(r, cx, cy, cz, axis='y', n=12, sphereR=0.06) {
    for (let i = 0; i < n; i++) {
      let a = 2*Math.PI*i/n;
      if (axis === 'y') this.sphere(sphereR, cx + r*Math.cos(a), cy, cz + r*Math.sin(a), 5, 4);
      if (axis === 'x') this.sphere(sphereR, cx, cy + r*Math.cos(a), cz + r*Math.sin(a), 5, 4);
      if (axis === 'z') this.sphere(sphereR, cx + r*Math.cos(a), cy + r*Math.sin(a), cz, 5, 4);
    }
  }

  // Arco de esferas (para chifres curvos)
  arcChain(r, cx, cy, cz, angleStart, angleEnd, axis='z', n=6) {
    for (let i = 0; i < n; i++) {
      let t = i / (n-1 || 1);
      let a = angleStart + (angleEnd - angleStart) * t;
      let px, py, pz;
      if (axis === 'z') { px = cx + r*Math.cos(a); py = cy + r*Math.sin(a); pz = cz; }
      else if (axis === 'y') { px = cx + r*Math.cos(a); pz = cz + r*Math.sin(a); py = cy; }
      else { py = cy + r*Math.cos(a); pz = cz + r*Math.sin(a); px = cx; }
      this.sphere(r*0.7, px, py, pz, 6, 5);
    }
  }

  // Elipse (discos achatados - para orelhas, barbas)
  oval(rx, ry, cx=0, cy=0, cz=0, thickness=0.3, seg=14) {
    let th = thickness * s_current * 0.15;
    for (let face = 0; face < 2; face++) {
      let sign = face === 0 ? 1 : -1;
      for (let i = 0; i < seg; i++) {
        let a0 = 2*Math.PI*i/seg, a1 = 2*Math.PI*(i+1)/seg;
        let c0x = rx*Math.cos(a0), c0y = ry*Math.sin(a0);
        let c1x = rx*Math.cos(a1), c1y = ry*Math.sin(a1);
        this.tri(
          [c0x*s_current, c0y*s_current, sign*th + cz],
          [c1x*s_current, c1y*s_current, sign*th + cz],
          [c0x*s_current, c0y*s_current, -sign*th + cz]
        );
      }
    }
    for (let i = 0; i < seg; i++) {
      let a0 = 2*Math.PI*i/seg, a1 = 2*Math.PI*(i+1)/seg;
      let x0 = rx*Math.cos(a0)*s_current, y0 = ry*Math.sin(a0)*s_current;
      let x1 = rx*Math.cos(a1)*s_current, y1 = ry*Math.sin(a1)*s_current;
      this.tri([x0+cx,y0+cy,th+cz],[x1+cx,y1+cy,th+cz],[x0+cx,y0+cy,-th+cz]);
      this.tri([x0+cx,y0+cy,-th+cz],[x1+cx,y1+cy,th+cz],[x1+cx,y1+cy,-th+cz]);
    }
  }

  toGeometry() {
    let pos = [];
    for (let i = 0; i < this.v.length; i += 12) {
      pos.push(this.v[i+3], this.v[i+4], this.v[i+5]);
      pos.push(this.v[i+6], this.v[i+7], this.v[i+8]);
      pos.push(this.v[i+9], this.v[i+10], this.v[i+11]);
    }
    let geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    geo.computeVertexNormals();
    return geo;
  }

  toSTL(name="FarmAnimal3D") {
    let tris = this.v.length / 12;
    let buf = new ArrayBuffer(84 + tris * 50);
    let view = new DataView(buf);
    for (let i = 0; i < 80; i++) view.setUint8(i, i < name.length ? name.charCodeAt(i) : 0);
    view.setUint32(80, tris, true);
    let off = 84;
    for (let i = 0; i < this.v.length; i += 12) {
      for (let k = 0; k < 12; k++) { view.setFloat32(off, this.v[i+k], true); off += 4; }
      view.setUint16(off, 0, true); off += 2;
    }
    return buf;
  }
}

let s_current = 1;

/* =====================================================================
   FUNÇÕES DE CABEÇA ESPECIALIZADAS (alta precisão)
   ===================================================================== */

function headBovineReal(g, s, cx, cy, cz) {
  // Crânio principal (elipsoide alongado)
  g.ellipsoid(0.95*s, 0.88*s, 1.25*s, cx, cy, cz);
  // Focinho robusto com sulco (2 partes)
  g.ellipsoid(0.76*s, 0.62*s, 0.82*s, cx, cy-0.42*s, cz+0.95*s);
  // Narinas com sulco (2 narizolas)
  g.sphere(0.13*s, cx-0.26*s, cy-0.45*s, cz+1.42*s, 7, 5);
  g.sphere(0.13*s, cx+0.26*s, cy-0.45*s, cz+1.42*s, 7, 5);
  // Nariz com sulco (discos achatados)
  g.oval(0.22*s, 0.12*s, cx, cy-0.58*s, cz+1.45*s, 0.18);
  // Olhos profundos
  g.sphere(0.2*s, cx-0.46*s, cy+0.28*s, cz+0.82*s, 7, 5);
  g.sphere(0.2*s, cx+0.46*s, cy+0.28*s, cz+0.82*s, 7, 5);
  // Sobrancelhas (duas esferas)
  g.sphere(0.12*s, cx-0.52*s, cy+0.78*s, cz+0.45*s, 6, 5);
  g.sphere(0.12*s, cx+0.52*s, cy+0.78*s, cz+0.45*s, 6, 5);
  // Chifres duplos em espiral (duas curvas paralelas)
  for (let side of [-1, 1]) {
    for (let i = 0; i < 5; i++) {
      let t = i / 4;
      let curveX = cx + side * (0.42 + t*0.4) * s;
      let curveY = cy + 0.95*s + t * 1.0 * s;
      let curveZ = cz + 0.35*s + side * t * 0.55 * s;
      let r = 0.12*s * (1.2 - t*0.4);
      g.sphere(r, curveX, curveY, curveZ, 6, 5);
    }
  }
  // Orelhas grandes e alongadas
  g.oval(0.65*s, 1.9*s, cx-1.15*s, cy+0.52*s, cz-0.15*s, 0.45);
  g.oval(0.65*s, 1.9*s, cx+1.15*s, cy+0.52*s, cz-0.15*s, 0.45);
}

function headBovineBull(g, s, cx, cy, cz) {
  // Version touro: maior, com chifres mais pesados
  g.ellipsoid(1.05*s, 0.95*s, 1.35*s, cx, cy, cz);
  g.ellipsoid(0.82*s, 0.68*s, 0.92*s, cx, cy-0.48*s, cz+1.05*s);
  g.sphere(0.14*s, cx-0.3*s, cy-0.52*s, cz+1.52*s, 7, 5);
  g.sphere(0.14*s, cx+0.3*s, cy-0.52*s, cz+1.52*s, 7, 5);
  g.sphere(0.22*s, cx-0.52*s, cy+0.32*s, cz+0.85*s, 7, 5);
  g.sphere(0.22*s, cx+0.52*s, cy+0.32*s, cz+0.85*s, 7, 5);
  // Chifres grossos em espiral
  for (let side of [-1, 1]) {
    for (let i = 0; i < 6; i++) {
      let t = i / 5;
      let curveX = cx + side * (0.45 + t*0.65) * s;
      let curveY = cy + 1.05*s + t * 1.3 * s;
      let curveZ = cz + 0.42*s + side * t * t * 0.7 * s;
      let r = 0.15*s * (1.5 - t*0.5);
      g.sphere(r, curveX, curveY, curveZ, 7, 5);
      if (i > 0) g.chain(0.12*s, cx + side*0.45*s, cy+1.05*s, cz+0.42*s,
                        curveX - (cx + side*0.45*s),
                        curveY - (cy+1.05*s),
                        curveZ - (cz+0.42*s), 5, 0.85);
    }
  }
  g.oval(0.75*s, 1.1*s, cx-1.25*s, cy+0.6*s, cz, 0.5);
  g.oval(0.75*s, 1.1*s, cx+1.25*s, cy+0.6*s, cz, 0.5);
}

function headEquineReal(g, s, cx, cy, cz) {
  // Crânio alongado
  g.ellipsoid(0.72*s, 0.78*s, 1.55*s, cx, cy, cz);
  // Focinho pequeno e arredondado
  g.ellipsoid(0.58*s, 0.52*s, 0.68*s, cx, cy-0.4*s, cz+1.1*s);
  // Narinas
  g.sphere(0.09*s, cx-0.24*s, cy-0.02*s, cz+1.6*s, 6, 4);
  g.sphere(0.09*s, cx+0.24*s, cy-0.02*s, cz+1.6*s, 6, 4);
  // Olhos grandes
  g.sphere(0.18*s, cx-0.42*s, cy+0.34*s, cz+0.72*s, 7, 5);
  g.sphere(0.18*s, cx+0.42*s, cy+0.34*s, cz+0.72*s, 7, 5);
  // Orelhas longas e pontiagudas (cônicas)
  g.con(0.16*s, 0.85*s, cx-0.36*s, cy+1.15*s, cz+0.22*s, 12);
  g.con(0.16*s, 0.85*s, cx+0.36*s, cy+1.15*s, cz+0.22*s, 12);
  // Detalhe: lobo da orelha
  g.sphere(0.12*s, cx-0.42*s, cy+1.6*s, cz+0.35*s, 6, 4);
  g.sphere(0.12*s, cx+0.42*s, cy+1.6*s, cz+0.35*s, 6, 4);
}

function headPorineReal(g, s, cx, cy, cz) {
  // Cabeça arredondada (típica)
  g.sphere(1.15*s, cx, cy, cz, 16, 14);
  // Focinho achatado e MUITO alongado (característico)
  g.ellipsoid(0.82*s, 0.48*s, 0.62*s, cx, cy-0.48*s, cz+1.05*s, 14, 8);
  g.ellipsoid(0.68*s, 0.42*s, 0.52*s, cx, cy-0.62*s, cz+1.55*s, 12, 8);
  // Narinas grandes e patetas
  g.sphere(0.16*s, cx-0.32*s, cy-0.52*s, cz+1.85*s, 8, 6);
  g.sphere(0.16*s, cx+0.32*s, cy-0.52*s, cz+1.85*s, 8, 6);
  // Olhos grandes e brilhantes
  g.sphere(0.23*s, cx-0.5*s, cy+0.36*s, cz+0.72*s, 8, 6);
  g.sphere(0.23*s, cx+0.5*s, cy+0.36*s, cz+0.72*s, 8, 6);
  // Orelhas GRANDES e caídas (característica)
  g.oval(0.58*s, 1.85*s, cx-1.05*s, cy+0.4*s, cz+0.55*s, 0.55);
  g.oval(0.58*s, 1.85*s, cx+1.05*s, cy+0.4*s, cz+0.55*s, 0.55);
  // Nariz com sulco (2 bolhas conectadas)
  g.sphere(0.08*s, cx-0.12*s, cy-0.75*s, cz+1.95*s, 5, 4);
  g.sphere(0.08*s, cx+0.12*s, cy-0.75*s, cz+1.95*s, 5, 4);
}

function headAveReal(g, s, cx, cy, cz) {
  // Crânio redondo
  g.sphere(0.68*s, cx, cy, cz, 14, 12);
  // Bico alongado e curvo (duas partes)
  g.con(0.18*s, 0.72*s, cx, cy-0.12*s, cz+0.85*s, 10);
  g.con(0.15*s, 0.42*s, cx, cy-0.08*s, cz+1.55*s, 10);
  // Narina
  g.sphere(0.06*s, cx, cy-0.05*s, cz+1.95*s, 6, 4);
  // Olhos grandes
  g.sphere(0.15*s, cx-0.34*s, cy+0.2*s, cz+0.52*s, 7, 5);
  g.sphere(0.15*s, cx+0.34*s, cy+0.2*s, cz+0.52*s, 7, 5);
  // Crista (cockscomb) - formato de onda
  for (let i = 0; i < 5; i++) {
    let w = 0.22*s - i*0.04*s;
    let off = (2-i) * 0.15*s;
    g.ellipsoid(w, 0.38*s, 0.28*s, cx+off, cy+0.85*s, cz+0.12*s);
  }
  // Barbela (wattle) inferior - 2 bolhas grandes
  g.sphere(0.2*s, cx-0.22*s, cy-0.15*s, cz+0.52*s, 8, 6);
  g.sphere(0.2*s, cx+0.22*s, cy-0.15*s, cz+0.52*s, 8, 6);
  // Bigode (pelos) - círculo de esferas pequenas
  g.ring(0.18*s, cx, cy-0.15*s, cz+0.72*s, 'y', 16, 0.04*s);
  // Detalhe: narina inferior (barbela)
  g.ellipseRing(0.14*s, cx, cy-0.35*s, cz+0.65*s, 10);
}

function headOvineReal(g, s, cx, cy, cz) {
  // Crânio arredondado
  g.sphere(0.8*s, cx, cy, cz, 14, 12);
  // Focinho curto e redondo
  g.ellipsoid(0.64*s, 0.54*s, 0.58*s, cx, cy-0.4*s, cz+0.85*s, 14, 10);
  // Narinas
  g.sphere(0.11*s, cx-0.22*s, cy-0.28*s, cz+1.25*s, 7, 5);
  g.sphere(0.11*s, cx+0.22*s, cy-0.28*s, cz+1.25*s, 7, 5);
  // Olhos grandes (expressivos)
  g.sphere(0.17*s, cx-0.38*s, cy+0.26*s, cz+0.58*s, 7, 5);
  g.sphere(0.17*s, cx+0.38*s, cy+0.26*s, cz+0.58*s, 7, 5);
  // Orelhas caídas (longas)
  g.oval(0.58*s, 1.55*s, cx-0.92*s, cy-0.02*s, cz+0.42*s, 0.48);
  g.oval(0.58*s, 1.55*s, cx+0.92*s, cy-0.02*s, cz+0.42*s, 0.48);
  // Chifres em espiral (duplos)
  for (let side of [-1, 1]) {
    for (let i = 0; i < 7; i++) {
      let t = i / 6;
      let curveX = cx + side * (0.42 + t*0.6) * s;
      let curveY = cy + 0.92*s + t * 1.1 * s;
      let curveZ = cz + 0.25*s + side * t * t * 0.8 * s;
      let r = 0.13*s * (1.4 - t*0.5);
      g.sphere(r, curveX, curveY, curveZ, 7, 5);
    }
  }
  // Barba (bigode chinês - típico de carneiro)
  g.chain(0.09*s, cx-0.25*s, cy-0.55*s, cz+0.35*s, 0, -0.35*s, 0.05*s, 6, 0.7);
  g.chain(0.09*s, cx+0.25*s, cy-0.55*s, cz+0.35*s, 0, -0.35*s, -0.05*s, 6, 0.7);
  // Detalhe: sobrancelhas
  g.sphere(0.08*s, cx-0.42*s, cy+0.65*s, cz+0.35*s, 5, 4);
  g.sphere(0.08*s, cx+0.42*s, cy+0.65*s, cz+0.35*s, 5, 4);
}

/* =====================================================================
   FUNÇÕES DE PERNAS COM DETALHES MUSCULARES
   ===================================================================== */

function legHoof(g, s, x, z, totalHeight, isFront=true) {
  let h = totalHeight;
  let kneeY = isFront ? h*0.68 : h*0.62;

  // Coxa (músculo)
  g.frustum(0.58*s, 0.42*s, h*0.28, x, h*0.86, z, 16);
  // Joelho
  g.sphere(0.45*s, x, kneeY, z + 0.32*s, 12, 10);
  // Perna inferior
  g.frustum(0.42*s, 0.32*s, h*0.42, x, h*0.55, z, 16);
  // Tornozelo/garfo
  g.sphere(0.32*s, x, h*0.28, z + 0.28*s, 10, 8);
  // Perna final
  g.frustum(0.32*s, 0.22*s, h*0.28, x, h*0.14, z, 14);
  // Casco duplo (chifre)
  g.frustum(0.48*s, 0.32*s, h*0.08, x, h*0.12, z - 0.38*s, 14);
  g.frustum(0.48*s, 0.32*s, h*0.08, x, h*0.12, z + 0.38*s, 14);
  // Solado
  g.cyl(0.36*s, h*0.1, x, h*0.08, z, 14);
  // Detalhe: sulco no casco
  g.cyl(0.24*s, h*0.04, x, h*0.16, z, 12);
}

/* =====================================================================
   FUNÇÕES AUXILIARES
   ===================================================================== */

function udderComplex(g, s, cx, cy, cz) {
  g.ellipsoid(0.72*s, 0.52*s, 0.85*s, cx, cy, cz);
  // 4 tetos com detalhes
  for (let [dx, dz, r] of [[-0.26*s, -0.12*s, 0.13*s], [0.26*s, -0.12*s, 0.13*s],
                          [-0.26*s, 0.12*s, 0.11*s], [0.26*s, 0.12*s, 0.11*s]]) {
    g.con(r, 0.42*s, cx+dx, cy-0.28*s, cz+dz, 8);
    // Detalhe: orifício do leite
    g.sphere(r*0.35, cx+dx, cy-0.62*s, cz+dz, 5, 4);
    g.chain(r*0.45, cx+dx, cy-0.58*s, cz+dz, -0.02*s, -0.28*s, 0, 4, 0.7);
  }
}

function maneHair(g, s, startX, startY, startZ, endX, endY, endZ, baseR) {
  // Cadeia principal de esferas
  neckArc(g, s, startX, startY, startZ, endX, endY, endZ, baseR, 6);
  // Pelos individuais saindo da linha central
  for (let i = 0; i < 6; i++) {
    let t = i / 5;
    let px = startX + (endX - startX) * t + (Math.random() - 0.5) * 0.2 * s;
    let py = startY + (endY - startY) * t;
    let pz = startZ + (endZ - startZ) * t;
    let len = (0.3 + Math.random() * 0.4) * s;
    let angX = (Math.random() - 0.5) * 0.6;
    let angZ = (Math.random() - 0.5) * 0.4;
    g.chain(baseR * 0.35, px, py, pz, angX*len, (Math.random()*0.4+0.4)*len, angZ*len, 5, 0.65);
  }
}

function neckArc(g, s, startX, startY, startZ, endX, endY, endZ, baseR, nSeg=6) {
  for (let i = 0; i < nSeg; i++) {
    let t = i / (nSeg-1 || 1);
    let px = startX + (endX - startX) * t;
    let py = startY + (endY - startY) * t + Math.sin(t*Math.PI) * 0.45 * s;
    let pz = startZ + (endZ - startZ) * t;
    let r = baseR * (1 - t*0.12);
    g.sphere(r, px, py, pz, 14, 12);
  }
}

/* =====================================================================
   ANIMAIS SÓLIDOS - VERSÃO HIPER-DETALHADA
   ===================================================================== */

function genBovine(s) {
  s_current = s;
  let g = new Gen();
  let isBull = false; // vaca por padrão

  // Tronco com volume realista
  g.ellipsoid(2.3*s, 2.05*s, 3.25*s, 0, 3.6*s, 0);       // corpo principal
  g.ellipsoid(2.1*s, 1.9*s, 1.4*s, 0, 3.7*s, 2.15*s);    // peito (cavidade torácica saliente)
  g.ellipsoid(2.1*s, 1.9*s, 1.4*s, 0, 3.7*s, -2.15*s);   // garupa
  // Músculos visíveis (coxia, abdominais)
  g.ellipsoid(2.5*s, 1.0*s, 1.2*s, 0, 4.3*s, 0);         // coxia/lomo
  g.ellipsoid(2.4*s, 0.75*s, 1.0*s, 0, 2.9*s, 0);        // ventre

  // Úbere com 4 tetos detalhados
  udderComplex(g, s, 0, 1.75*s, -0.92*s);

  // Pernas com cascos duplos detalhados
  let legs = [[-1.35*s, 2.1*s, true], [1.35*s, 2.1*s, true],
              [-1.35*s, -2.1*s, false], [1.35*s, -2.1*s, false]];
  for (let [lx, lz, isFront] of legs) {
    legHoof(g, s, lx, lz, 2.8*s, isFront);
  }

  // Pescoço com músculos (6 esferas)
  neckArc(g, s, 0, 4.7*s, 2.1*s, 0, 5.8*s, 3.2*s, 1.15*s, 5);

  // Cabeça detalhada
  headBovineReal(g, s, 0, 6.2*s, 3.75*s);

  // Rabo curvo com pelos
  g.frustum(0.16*s, 0.09*s, 2.4*s, 0, 3.6*s, -3.15*s, 12);
  g.chain(0.05*s, 0, 2.9*s, -3.2*s, 0, -0.3*s, -0.25*s, 10, 0.6);

  return g;
}

function genBull(s) {
  s_current = s;
  let g = new Gen();
  // Corpo musculoso
  g.ellipsoid(2.4*s, 2.15*s, 3.4*s, 0, 3.7*s, 0);
  g.ellipsoid(2.2*s, 2.0*s, 1.5*s, 0, 3.8*s, 2.25*s);
  g.ellipsoid(2.2*s, 2.0*s, 1.5*s, 0, 3.8*s, -2.25*s);
  g.ellipsoid(2.6*s, 1.1*s, 1.3*s, 0, 4.4*s, 0); // músculo lomo
  // 4 patas
  let legs = [[-1.4*s, 2.2*s, true], [1.4*s, 2.2*s, true],
              [-1.4*s, -2.2*s, false], [1.4*s, -2.2*s, false]];
  for (let [lx, lz, isFront] of legs) {
    legHoof(g, s, lx, lz, 2.9*s, isFront);
  }
  // Pescoço curto e grosso (carneiro)
  neckArc(g, s, 0, 4.9*s, 2.3*s, 0, 5.6*s, 3.6*s, 1.35*s, 4);
  // Cabeça de touro (chifres pesados)
  headBovineBull(g, s, 0, 5.9*s, 3.75*s);
  // Rabo curto e grosso
  g.cyl(0.22*s, 1.8*s, 0, 5.0*s, -3.3*s, 10);
  // Detalhe: pelos no pescoço
  maneHair(g, s, 0, 5.05*s, 2.4*s, 0, 5.6*s, 3.5*s, 0.85*s);

  return g;
}

function genEquine(s) {
  s_current = s;
  let g = new Gen();

  // Tronco atlético e musculoso
  g.ellipsoid(1.85*s, 1.9*s, 3.4*s, 0, 4.0*s, -0.3*s);
  g.ellipsoid(1.7*s, 1.75*s, 1.4*s, 0, 4.15*s, 2.3*s);
  g.ellipsoid(1.7*s, 1.75*s, 1.4*s, 0, 4.15*s, -2.6*s);
  // Músculo do ombro
  g.ellipsoid(2.0*s, 1.2*s, 1.35*s, 0, 4.8*s, 2.2*s);
  g.ellipsoid(2.0*s, 1.2*s, 1.35*s, 0, 4.8*s, -2.4*s);
  // Músculo do quadril
  g.ellipsoid(1.9*s, 1.3*s, 1.3*s, 0, 3.1*s, 2.3*s);
  g.ellipsoid(1.9*s, 1.3*s, 1.3*s, 0, 3.1*s, -2.5*s);

  // 4 pernas longas com músculos
  let legs = [[-1.02*s, 2.5*s, true], [1.02*s, 2.5*s, true],
              [-0.98*s, -2.7*s, false], [0.98*s, -2.7*s, false]];
  for (let [lx, lz, isFront] of legs) {
    legHoof(g, s, lx, lz, 3.8*s, isFront);
  }

  // Pescoço arqueado (forte curvatura - característico)
  neckArc(g, s, 0, 5.2*s, 1.95*s, 0, 6.6*s, 3.5*s, 1.15*s, 6);

  // Cabeça longa e elegante
  headEquineReal(g, s, 0, 7.05*s, 3.45*s);

  // Crina (cabelos individuais densos)
  for (let i = 0; i < 40; i++) {
    let t = i / 39;
    let py = 5.2*s + t * 1.8*s;
    let pz = 1.95*s + Math.sin(t * Math.PI) * 0.45*s + Math.cos(t*3) * 0.15*s;
    let r = 0.19*s * (1 - t*0.25);
    if (i % 2 === 0) {
      g.chain(r*0.4, 0, py, pz, (Math.random()-0.5)*0.15*s, 0.15*s, (Math.random()-0.5)*0.2*s, 7, 0.65);
    } else {
      g.chain(r*0.35, 0, py, pz, 0, 0.18*s, 0, 5, 0.7);
    }
  }
  // Detalhe: crina no topo do pescoço (mais longa)
  maneHair(g, s, 0, 5.3*s, 2.2*s, 0, 6.5*s, 3.7*s, 0.95*s);

  // Rabo longo com penas
  g.chain(0.075*s, 0, 4.35*s, -3.5*s, 0, -1.4*s, 0.45*s, 10, 0.7);
  g.chain(0.055*s, 0, 3.2*s, -3.3*s, 0, -1.0*s, 0.65*s, 8, 0.65);
  // Detalhe: pêlos no rabo
  for (let i = 0; i < 6; i++) {
    let t = i / 5;
    g.chain(0.05*s, 0, 4.35*s + t*0.8*s, -3.5*s + t*0.3*s, 0.05*s, 0.12*s, 0.03*s, 4, 0.6);
  }

  return g;
}

function genPorine(s) {
  s_current = s;
  let g = new Gen();

  // Corpo gordo e arredondado
  g.ellipsoid(2.6*s, 1.95*s, 2.95*s, 0, 3.0*s, 0);
  g.ellipsoid(2.4*s, 1.75*s, 1.45*s, 0, 3.15*s, 2.15*s);
  // Ventríbulo/gordura abdominal
  g.ellipsoid(2.5*s, 1.45*s, 2.1*s, 0, 1.95*s, 0);

  // 4 patas curtas e gordas
  let legs = [[-1.55*s, 1.75*s, true], [1.55*s, 1.75*s, true],
              [-1.55*s, -1.75*s, false], [1.55*s, -1.75*s, false]];
  for (let [lx, lz, isFront] of legs) {
    // Pernas com gordura visível
    g.frustum(0.55*s, 0.35*s, 0.9*s, lx, 1.85*s, lz, 14);
    g.sphere(0.4*s, lx, 0.95*s, lz + 0.28*s, 10, 8); // joelho
    g.frustum(0.35*s, 0.45*s, 0.3*s, lx, 0.5*s, lz, 14); // pé
    g.cyl(0.36*s, 0.35*s, lx, 0.35*s, lz, 12); // solado
  }

  // Cabeça com focinho característico (muito achatado)
  headPorineReal(g, s, 0, 3.55*s, 2.6*s);

  // Rabo em ESPÍRAL (detalhe: 360° * 2.5 voltas)
  let baseY = 3.2*s, baseZ = -2.75*s;
  for (let i = 0; i < 45; i++) {
    let t = i / 44;
    let ang = t * 2.5 * Math.PI;
    let r = 0.35*s * (1 - t*0.25);
    g.sphere(0.085*s*(1-t*0.2), 0, baseY + r*Math.cos(ang)*0.9, baseZ + r*Math.sin(ang)*0.9 - t*0.15*s, 6, 5);
  }

  // Detalhe: mancha de pelos no focinho
  g.chain(0.04*s, 0, 3.45*s, 4.75*s, 0, 0.15*s, 0, 6, 0.6);
  g.chain(0.04*s, 0, 3.45*s, 4.75*s, 0.15*s, 0.12*s, 0, 6, 0.6);

  return g;
}

function genAve(s) {
  s_current = s;
  let g = new Gen();
  let tailFeathers = 16;

  // Corpo (ovo)
  g.ellipsoid(1.55*s, 1.65*s, 2.1*s, 0, 3.15*s, 0);
  g.sphere(1.05*s, 0, 2.85*s, 1.05*s, 16, 14);  // peito
  g.ellipsoid(1.55*s, 1.35*s, 1.8*s, 0, 2.45*s, 0.32*s); // barriga

  // Pescoço alongado (4 esferas)
  neckArc(g, s, 0, 3.45*s, 1.05*s, 0, 4.1*s, 1.65*s, 0.42*s, 4);

  // Cabeça
  headAveReal(g, s, 0, 4.55*s, 1.65*s);

  // Asa (detalhe de penas individuais)
  for (let wing = -1; wing <= 1; wing += 2) {
    let wx = wing * 1.55*s;
    // Primeira pena maior (granjo primário)
    g.ellipsoid(0.18*s, 0.82*s, 0.28*s, wx, 3.05*s, 0.12*s);
    // Penas primárias (8 penas principais)
    for (let i = 0; i < 8; i++) {
      let py = 2.7*s - i*0.22*s;
      let pz = i*0.42*s * wing * 0.3;
      let len = 0.85*s - i*0.06*s;
      let r = 0.13*s - i*0.015*s;
      g.frustum(r, r*0.3, len, wx, py, pz, 6);
    }
    // Penas secundárias
    for (let i = 0; i < 5; i++) {
      let py = 3.2*s - i*0.18*s;
      let pz = -0.4*s * wing;
      g.ellipsoid(0.08*s, 0.45*s, 0.16*s, wx, py, pz);
    }
  }

  // Rabo em leque (16 penas individuais)
  for (let i = -tailFeathers/2; i <= tailFeathers/2; i++) {
    if (i === 0) continue;
    let seg = Math.abs(i);
    let r = 0.13*s - seg*0.045*s;
    let len = 0.95*s - seg*0.045*s;
    let zoff = i * 0.22 * s;
    g.frustum(Math.max(r, 0.035*s), r*0.35, len, 0.3*s*seg/Math.abs(i),
              4.5*s + seg*0.12*s, -1.6*s + zoff, 8);
  }
  // Pena-central do rabo
  g.ellipseRing(0.18*s, 0, 4.7*s, -1.45*s, 14);

  // Pernas (4 patas)
  for (let side of [-1, 1]) {
    // Perna dianteira
    g.cyl(0.16*s, 1.8*s, side*0.55*s, 1.05*s, 0.62*s, 10);
    // Pé com 4 garras
    for (let g_ = 0; g_ < 4; g_++) {
      let ang = (g_ - 1.5) * 0.25;
      let gx = side*0.55*s + Math.sin(ang)*0.22*s;
      let gz = 0.62*s + Math.cos(ang)*0.28*s;
      g.frustum(0.055*s, 0.025*s, 0.55*s, gx, 0.05*s, gz, 6);
    }
    // Perna traseira
    g.cyl(0.17*s, 1.9*s, side*0.68*s, 0.42*s, -0.58*s, 10);
    for (let gg = 0; gg < 4; gg++) {
      let ang = (gg - 1.5) * 0.25;
      let gx = side*0.68*s + Math.sin(ang)*0.2*s;
      let gz = -0.58*s + Math.cos(ang)*0.26*s;
      g.frustum(0.05*s, 0.022*s, 0.5*s, gx, 0.05*s, gz, 6);
    }
  }

  return g;
}

function genOvine(s) {
  s_current = s;
  let g = new Gen();

  // Corpo lã (volumoso)
  g.ellipsoid(2.15*s, 2.1*s, 2.95*s, 0, 3.7*s, 0);
  g.ellipsoid(2.05*s, 1.95*s, 1.5*s, 0, 3.85*s, 2.05*s);
  g.ellipsoid(2.05*s, 1.95*s, 1.5*s, 0, 3.85*s, -2.05*s);

  // LÃ - 3 camadas de tufts (muito detalhado)
  // Camada superior (mais longa)
  for (let row = 0; row < 3; row++) {
    for (let col = -2; col <= 2; col++) {
      for (let d = -1; d <= 1; d += 2) {
        let py = 4.3*s + row*0.65*s;
        let pr = 0.88*s - row*0.1*s;
        let pz = d * (1.6 + row*0.2) * s + col*0.8*s;
        let px = col * 0.6 * s;
        if (Math.random() > 0.05) g.sphere(pr, px, py, pz, 9, 7);
      }
    }
  }
  // Camada de lado (muito volumosa)
  for (let i = 0; i < 20; i++) {
    let t = i / 19;
    let py = 3.8*s + t * 0.6 * s;
    let pr = 1.05*s * (1 - t*0.25);
    let px = 2.1*s + Math.sin(t*Math.PI)*0.1*s;
    g.sphere(pr, px, py, 0, 9, 7);
    g.sphere(pr, -px, py, 0, 9, 7);
  }
  // Camada inferior (costas)
  for (let i = 0; i < 8; i++) {
    let t = i / 7;
    let py = 5.2*s + t*0.7*s;
    let pz = -2.3*s + t*0.2*s;
    g.sphere(0.82*s, 0, py, pz, 9, 7);
    g.sphere(0.82*s, 0, py, -pz, 9, 7);
  }
  // Camada central (mais densa)
  for (let ring = 0; ring < 4; ring++) {
    let r = 2.2*s - ring*0.6*s;
    let h = 4.5*s + ring*1.0*s;
    let num = 14 - ring*2;
    for (let i = 0; i < num; i++) {
      let a = 2*Math.PI*i/num;
      g.sphere(0.65*s, r*Math.cos(a), h, r*Math.sin(a), 7, 6);
    }
  }

  // Pernas finas
  for (let [lx, lz] of [[-1.18*s, 1.75*s], [1.18*s, 1.75*s], [-1.18*s, -1.75*s], [1.18*s, -1.75*s]]) {
    g.frustum(0.32*s, 0.18*s, 2.75*s, lx, 1.4*s, lz, 18);
    g.sphere(0.24*s, lx, 0.85*s, lz + 0.22*s, 10, 8); // joelho
    g.frustum(0.18*s, 0.14*s, 2.0*s, lx, 0.45*s, lz, 16);
    g.frustum(0.22*s, 0.27*s, 0.28*s, lx, 0.22*s, lz, 14); // casco
  }

  // Cabeça pequena
  headOvineReal(g, s, 0, 5.25*s, 2.85*s);

  // Rabo curto
  g.sphere(0.42*s, 0, 4.1*s, -2.95*s, 10, 8);
  g.chain(0.06*s, 0, 3.8*s, -2.9*s, 0, -0.2*s, -0.1*s, 5, 0.6);

  return g;
}

function partsEquine(s) {
  let parts = [];

  let t = new Gen();
  s_current = s;
  t.ellipsoid(1.85*s, 1.9*s, 3.4*s, 0, 4.0*s, -0.3*s);
  t.ellipsoid(1.7*s, 1.75*s, 1.4*s, 0, 4.15*s, 2.3*s);
  t.ellipsoid(1.7*s, 1.75*s, 1.4*s, 0, 4.15*s, -2.6*s);
  t.ellipsoid(2.0*s, 1.2*s, 1.35*s, 0, 4.8*s, 2.2*s);
  t.ellipsoid(2.0*s, 1.2*s, 1.35*s, 0, 4.8*s, -2.4*s);
  neckArc(t, s, 0, 5.2*s, 1.95*s, 0, 6.4*s, 3.5*s, 1.15*s, 5);
  // Crina
  for (let i = 0; i < 25; i++) {
    let tt = i / 24;
    let py = 5.2*s + tt * 1.2*s;
    let pz = 1.95*s + Math.sin(tt * Math.PI) * 0.4*s;
    let pr = 0.19*s * (1 - tt*0.25);
    t.chain(pr, 0, py, pz, 0, 0.09*s, 0.05*s, 5, 0.7);
  }
  t.joint(0.5*s, 0, 6.65*s, 3.7*s);
  t.frustum(0.12*s, 0.05*s, 2.4*s, 0, 3.8*s, -3.4*s, 10);
  t.chain(0.055*s, 0, 3.3*s, -3.2*s, 0, -0.8*s, 0.3*s, 8, 0.7);

  h.joint(0.42*s, 0, -1.6*s, 0.25*s);
  parts.push({name:"02_cabeca", desc:"Cabeça longa, orelhas pontiagudas, focinho", g:h});

  ];
  for (let [pn, pd, lx, lz] of legData) {
    let lg = new Gen();
    s_current = s;
    lg.joint(0.45*s, 0, 1.35*s, 0);
    lg.frustum(0.26*s, 0.38*s, 1.8*s, 0, 0.25*s, 0, 14);
    lg.sphere(0.32*s, 0, -0.35*s, 0.28*s, 10, 8);
    lg.frustum(0.26*s, 0.32*s, 1.0*s, 0, -0.85*s, 0, 12);
    lg.frustum(0.32*s, 0.38*s, 0.22*s, 0, -1.45*s, 0, 14);
    parts.push({name:pn, desc:pd+" (longa, articulada, casco)", g:lg});
  }

function partsPorine(s) {
  let parts = [];

  let t = new Gen();
  s_current = s;
  t.ellipsoid(2.6*s, 1.95*s, 2.95*s, 0, 3.0*s, 0);
  t.ellipsoid(2.4*s, 1.75*s, 1.45*s, 0, 3.15*s, 2.15*s);
  t.ellipsoid(2.5*s, 1.45*s, 2.1*s, 0, 1.95*s, 0);
  t.joint(0.6*s, 0, 3.65*s, 2.55*s);
  // Rabo espiral
  let baseY = 3.2*s, baseZ = -2.75*s;
  for (let i = 0; i < 45; i++) {
    let tt = i / 44;
    let ang = tt * 2.5 * Math.PI;
    let r = 0.35*s * (1 - tt*0.25);
    t.sphere(0.085*s*(1-tt*0.2), 0, baseY + r*Math.cos(ang)*0.9, baseZ + r*Math.sin(ang)*0.9 - tt*0.15*s, 6, 5);
  }
  parts.push({name:"01_tronco", desc:"Corpo arredondado, ventre, rabo espiral (2.5 voltas)", g:t});

  let h = new Gen();

function partsAve(s) {
  let parts = [];

  let t = new Gen();
  s_current = s;
  t.ellipsoid(1.55*s, 1.65*s, 2.1*s, 0, 3.15*s, 0);
  t.sphere(1.05*s, 0, 2.85*s, 1.05*s, 16, 14);
  t.ellipsoid(1.55*s, 1.35*s, 1.8*s, 0, 2.45*s, 0.32*s);
  // Pescoço
  neckArc(t, s, 0, 3.45*s, 1.05*s, 0, 4.0*s, 1.65*s, 0.42*s, 3);
  // Asas detalhadas
  for (let wing = -1; wing <= 1; wing += 2) {
    let wx = wing * 1.55*s;
    t.ellipsoid(0.18*s, 0.82*s, 0.28*s, wx, 3.05*s, 0.12*s);
    for (let i = 0; i < 6; i++) {
      let py = 2.8*s - i*0.2*s;
      t.ellipsoid(0.1*s, 0.42*s, 0.14*s, wx, py, 0.05*s);
    }
  }
  // Rabo em leque
  for (let i = -8; i <= 8; i++) {
    if (i === 0) continue;
    let seg = Math.abs(i);
    t.frustum(Math.max(0.12*s - seg*0.04*s, 0.035*s), 0.05*s, 0.85*s - seg*0.045*s,
              0.25*s*seg/8, 4.5*s + seg*0.12*s, -1.6*s + i*0.18*s, 8);
  }
  // Pernas
  for (let side of [-1, 1]) {
    t.cyl(0.16*s, 1.8*s, side*0.55*s, 1.05*s, 0.62*s, 10);
    t.ellipseRing(0.35*s, side*0.55*s, 0.18*s, 0.78*s, 16);
    t.cyl(0.17*s, 1.9*s, side*0.68*s, 0.42*s, -0.58*s, 10);
    t.ellipseRing(0.32*s, side*0.68*s, 0.17*s, -0.58*s, 16);
  }
  t.joint(0.4*s, 0, 4.35*s, 1.7*s);
  parts.push({name:"01_tronco", desc:"Corpo, asas com penas, rabo em leque, patas com garras", g:t});

  let h = new Gen();
  s_current = s;
  headAveReal(h, s, 0, 0, 0.25*s);
  h.joint(0.36*s, 0, -0.95*s, -0.15*s);
  parts.push({name:"02_cabeca", desc:"Cabeça com bico, crista, barbela, bigode", g:h});
  return parts;
}

function partsOvine(s) {
  let parts = [];

  let t = new Gen();
  s_current = s;
  t.ellipsoid(2.15*s, 2.1*s, 2.95*s, 0, 3.7*s, 0);
  t.ellipsoid(2.05*s, 1.95*s, 1.5*s, 0, 3.85*s, 2.05*s);
  t.ellipsoid(2.05*s, 1.95*s, 1.5*s, 0, 3.85*s, -2.05*s);
  // LÃ - múltiplas camadas
  for (let row = 0; row < 4; row++) {
    for (let col = -2; col <= 2; col++) {
      for (let d = -1; d <= 1; d += 2) {
        let py = 4.5*s + row*0.65*s;
        let pr = 0.92*s - row*0.08*s;
        let pz = d * (1.6 + row*0.25) * s + col*0.9*s;
        let px = col * 0.65 * s;
        if (Math.random() > 0.03) t.sphere(pr, px, py, pz, 9, 7);
      }
    }
  }
  for (let i = 0; i < 12; i++) {
    let a = 2*Math.PI*i/12;
    t.sphere(0.82*s, 2.3*s*Math.cos(a), 5.2*s, 2.3*s*Math.sin(a), 9, 7);
  }
  t.joint(0.52*s, 0, 5.45*s, 3.0*s);
  t.sphere(0.42*s, 0, 4.2*s, -3.0*s, 8, 6);
  parts.push({name:"01_tronco", desc:"Corpo com lã detalhada (30+ tufts), rabo", g:t});

  let h = new Gen();
  s_current = s;
  headOvineReal(h, s, 0, 0, 0.3*s);
  h.joint(0.42*s, 0, -0.95*s, 0.15*s);
  parts.push({name:"02_cabeca", desc:"Cabeça com chifres em espiral, orelhas, barba", g:h});

  let legData = [
    ["03_pata_fe","Pata frontal ESQ", -1.18*s, 1.75*s],
    ["04_pata_fd","Pata frontal DIR",  1.18*s, 1.75*s],
    ["05_pata_te","Pata traseira ESQ", -1.18*s, -1.75*s],
    ["06_pata_td","Pata traseira DIR",  1.18*s, -1.75*s]
  ];
  for (let [pn, pd, lx, lz] of legData) {
    let lg = new Gen();
    s_current = s;
    lg.joint(0.35*s, 0, 1.0*s, 0);
    lg.frustum(0.24*s, 0.36*s, 1.5*s, 0, 0.15*s, 0, 12);
    lg.frustum(0.28*s, 0.33*s, 0.25*s, 0, -0.65*s, 0, 12);
    parts.push({name:pn, desc:pd+" (longa, fina)", g:lg});
  }
  return parts;
}

/* =====================================================================
   VIEWER THREE.JS
   ===================================================================== */
const viewer = document.getElementById('viewer');
const canvasEl = document.getElementById('viewer-canvas');
const loadingOv = document.getElementById('loading');
const statusText = document.getElementById('status-text');
const progressBar = document.getElementById('progress-bar');
const animalTag = document.getElementById('animal-tag');
const anatomyList = document.getElementById('anatomy-list');

let scene, camera, renderer, controls, currentGroup;

function initThree() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0xf0f2f5);

  camera = new THREE.PerspectiveCamera(45, viewer.clientWidth / viewer.clientHeight, 0.1, 500);
  camera.position.set(38, 26, 38);

  renderer = new THREE.WebGLRenderer({ canvas: canvasEl, antialias: true, alpha: false });
  renderer.setSize(viewer.clientWidth, viewer.clientHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.06;
  controls.enablePan = true;
  controls.minDistance = 8;
  controls.maxDistance = 200;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.7;
  controls.addEventListener('start', () => controls.autoRotate = false);

  // Luz ambiente
  scene.add(new THREE.AmbientLight(0xffffff, 0.55));
  // Luz direcional (sol)
  let sun = new THREE.DirectionalLight(0xffffff, 0.95);
  sun.position.set(40, 55, 30);
  sun.castShadow = true;
  sun.shadow.mapSize.width = 2048;
  sun.shadow.mapSize.height = 2048;
  sun.shadow.camera.left = -50; sun.shadow.camera.right = 50;
  sun.shadow.camera.top = 65; sun.shadow.camera.bottom = -30;
  sun.shadow.camera.near = 0.5; sun.shadow.camera.far = 200;
  scene.add(sun);

  // Chão
  let groundMat = new THREE.MeshStandardMaterial({ color: 0xf8f9fa });
  let ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), groundMat);
  ground.rotation.x = -Math.PI/2; ground.position.y = -0.1;
  ground.receiveShadow = true;
  scene.add(ground);

  let grid = new THREE.GridHelper(140, 40, 0xcccccc, 0xe8eaf6);
  grid.position.y = -0.05;
  scene.add(grid);

  animate();
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  let w = viewer.clientWidth, h = viewer.clientHeight;
  camera.aspect = w / h;
  camera.updateProjectionMaterial();
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});

function showLoading(v, msg="Gerando modelo 3D…") {
  loadingOv.innerHTML = v ? `<div class="spinner-border text-primary mb-2" role="status"></div><div class="fw-medium">${msg}</div><div class="small text-muted mt-1">Construindo geometria detalhada</div>` : '';
  loadingOv.style.display = v ? 'block' : 'none';
}
function updateStatus(t, pct=100) {
  statusText.textContent = t;
  progressBar.style.width = pct + '%';
  progressBar.className = 'progress-bar bg-' + (pct >= 100 ? 'success' : 'primary');
}
function showError(msg) {
  updateStatus('Erro: ' + msg, 0);
}

function makeMaterial(color = 0x8b7355) {
  return new THREE.MeshStandardMaterial({
    color: color,
    metalness: 0.02,
    roughness: 0.78,
    flatShading: false,
  });
}

function clearCurrent() {
  if (currentGroup) {
    scene.remove(currentGroup);
    currentGroup.traverse(o => { if (o.geometry) o.geometry.dispose(); });
    currentGroup = null;
  }
}

function frameCamera(group) {
  let box = new THREE.Box3().setFromObject(group);
  let center = box.getCenter(new THREE.Vector3());
  let size = box.getSize(new THREE.Vector3());
  let max = Math.max(size.x, size.y, size.z);
  let dist = max * 1.7;
  controls.target.set(center.x, Math.max(center.y, 3), center.z);
  camera.position.set(center.x + dist*0.9, center.y + dist*0.6, center.z + dist*0.9);
  controls.update();
}

function showSolid(gen) {
  showLoading(true, "Gerando modelo 3D…");
  updateStatus("Visualizando animal…", 60);
  setTimeout(() => {
    try {
      clearCurrent();
      let geo = gen.toGeometry();
      currentGroup = new THREE.Group();
      let m = new THREE.Mesh(geo, makeMaterial());
      m.castShadow = true; m.receiveShadow = true;
      let box = new THREE.Box3().setFromObject(m);
      let center = box.getCenter(new THREE.Vector3());
      m.position.sub(center);
      currentGroup.add(m);
      scene.add(currentGroup);
      frameCamera(currentGroup);
      updateStatus("Modelo 3D detalhado pronto", 100);
      showLoading(false);
    } catch(e) { console.error(e); showError(e.message); showLoading(false); }
  }, 100);
}

function showParts(parts) {
  showLoading(true, "Montando peças…");
  updateStatus("Preparando peças articuladas…", 50);
  setTimeout(() => {
    try {
      clearCurrent();
      currentGroup = new THREE.Group();
      let mat = makeMaterial();
      let n = parts.length;
      for (let i = 0; i < n; i++) {
        let p = parts[i];
        let geo = p.g.toGeometry();
        let m = new THREE.Mesh(geo, mat);
        m.castShadow = true; m.receiveShadow = true;
        let box = new THREE.Box3().setFromObject(m);
        let center = box.getCenter(new THREE.Vector3());
        m.position.sub(center);
        let angle = i / n * Math.PI * 2;
        let radius = n > 3 ? 20 : 10;
        m.position.x += Math.cos(angle) * radius;
        m.position.z += Math.sin(angle) * radius;
        m.rotation.y = -angle;
        currentGroup.add(m);
      }
      scene.add(currentGroup);
      frameCamera(currentGroup);
      updateStatus("Peças visualizadas (" + n + " peças)", 100);
      showLoading(false);
    } catch(e) { console.error(e); showError(e.message); showLoading(false); }
  }, 100);
}

/* ========= Ações ========= */
function getVals() {
  return {
    animal: document.getElementById('animal').value,
    scale: parseFloat(document.getElementById('scale').value) || 10,
    tipo: document.querySelector('input[name="tipo"]:checked').value,
    joint: parseFloat(document.getElementById('joint').value) || 3
  };
}

function updateAnatomyInfo() {
  let animal = document.getElementById('animal').value;
  let details = ANIMAL_DETAILS[animal] || [];
  let html = '';
  for (let d of details) {
    html += '<div class="detail-item"><span class="detail-dot"></span><span>' + d + '</span></div>';
  }
  anatomyList.innerHTML = html;
  let tags = {bovino:'🐄 Bovino', equino:'🐴 Equino', suino:'🐷 Suíno', ave:'🐔 Ave', ovino:'🐑 Ovino'};
  animalTag.textContent = tags[animal] || animal;
}

function regenerate() {
  updateAnatomyInfo();
  let v = getVals();
  if (v.tipo === 'solido') {
    showSolid(SOLID_GENS[v.animal](v.scale));
  } else {
    showParts(PARTS_GENS[v.animal](v.scale));
  }
}

function downloadSTL() {
  let v = getVals();
  showLoading(true, "Preparando STL…");
  setTimeout(() => {
    let buf = SOLID_GENS[v.animal](v.scale).toSTL(v.animal);
    let blob = new Blob([buf], {type: 'application/octet-stream'});
    let url = URL.createObjectURL(blob);
    let a = document.createElement('a');
    a.href = url;
    a.download = `${v.animal}_detalhado_${Math.round(v.scale*10)}mm.stl`;
    a.click();
    URL.revokeObjectURL(url);
    updateStatus("STL baixado com sucesso!", 100);
    showLoading(false);
  }, 100);
}

async function downloadZIP() {
  let v = getVals();
  showLoading(true, "Gerando ZIP…");
  setTimeout(async () => {
    let JSZip = await import('https://cdn.jsdelivr.net/npm/jszip@3.10.1/+esm');
    let zip = new (JSZip.default || JSZip)();
    let parts = PARTS_GENS[v.animal](v.scale);

    let guide = `ANIMAL ARTICULADO - ${v.animal.toUpperCase()}\n`;
    guide += `===========================================================\n\n`;
    guide += `Escala: ${v.scale} mm\n`;
    guide += `Diâmetro da junta (bola/soquete): ${v.joint} mm\n`;
    guide += `Número de peças: ${parts.length}\n\n`;
    guide += `PEÇAS:\n`;
    for (let p of parts) guide += `  📦 ${p.name}.stl — ${p.desc}\n`;
    guide += `\nMONTAGEM:\n`;
    guide += `  1. Tronco é a peça base (coloque no centro)\n`;
    guide += `  2. Cabeça: encaixe a BOLA no SOQUETE do tronco (pescoço)\n`;
    guide += `  3. Patas: encaixe as BOLAS nas posições laterais do tronco\n`;
    guide += `  4. Folga de impressão: 0.15-0.25mm por lado\n`;
    guide += `  5. Materiais: PLA ou PETG · 20% infill · 0.2mm camada\n`;
    guide += `  6. Suportes: NÃO NECESSÁRIOS (modelos auto-sustentados)\n`;

    zip.file('00_GUIA_MONTAGEM.txt', guide);
    for (let p of parts) zip.file(`${p.name}.stl`, p.g.toSTL(p.name));

    let blob = await zip.generateAsync({type:'blob', compression:'DEFLATE'});
    let url = URL.createObjectURL(blob);
    let a = document.createElement('a');
    a.href = url;
    a.download = `${v.animal}_articulado_${Math.round(v.scale*10)}mm.zip`;
    a.click();
    URL.revokeObjectURL(url);
    updateStatus("ZIP baixado com sucesso!", 100);
    showLoading(false);
  }, 100);
}

/* ======== Eventos ======== */
document.getElementById('btn-view').addEventListener('click', regenerate);
document.getElementById('btn-stl').addEventListener('click', () => { downloadSTL(); });
document.getElementById('btn-zip').addEventListener('click', () => { downloadZIP(); });

document.getElementById('animal').addEventListener('change', () => { updateAnatomyInfo(); regenerate(); });

let scaleSlider = document.getElementById('scale');
let scaleVal = document.getElementById('scaleVal');
scaleSlider.addEventListener('input', () => {
  scaleVal.textContent = scaleSlider.value;
  clearTimeout(window._deb);
  window._deb = setTimeout(regenerate, 300);
});

let jointSlider = document.getElementById('joint');
let jointVal = document.getElementById('jointVal');
jointSlider.addEventListener('input', () => { jointVal.textContent = jointSlider.value; });

document.querySelectorAll('input[name="tipo"]').forEach(r => {
  r.addEventListener('change', () => {
    document.getElementById('joint-field').style.display = (r.value === 'articulado') ? 'block' : 'none';
    regenerate();
  });
});

// Init
updateAnatomyInfo();
initThree();
regenerate();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
